#cloud-config
autoinstall:
  version: 1
  interactive-sections: []

  identity:
    hostname: P250253.vito.local
    username: user
    password: "$6$rounds=656000$ADfxhvejGafxsnZv$LMYXLUL.wmjtPmgv.ax1BYQv78Vv1BJQCE9igdCRXMQlM5pBuQyCpskxOTHXUeDr8oChjxLankzZ23wOxfNuR0"

  ssh:
    install-server: false
    allow-pw: false

  locale: "en_US.UTF-8"
  keyboard:
    layout: be
    variant: ""
  timezone: "Europe/Brussels"

  network:
    version: 2
    ethernets:
      eth0:
        match:
          name: "*"
        dhcp4: true
        dhcp6: false

  storage:
    layout:
      name: hybrid
      encrypted: yes

  apt:
    sources:
      main:
        arch: [amd64, i386]
        uri: http://archive.ubuntu.com/ubuntu
        suites: [noble]
        components: [main, restricted, universe]

  # --- TPM setup before partitioning/encryption ---
  early-commands:
    # Make sure TPM tools are available inside the installer environment
    - apt-get update
    - apt-get install -y tpm2-tools
    # Check TPM presence
    - bash -c 'tpm2_getcap properties-fixed || echo "TPM not found"'
    # Clear and take ownership (optional but ensures a clean TPM)
    - bash -c 'tpm2_clear || true'
    - bash -c 'tpm2_getrandom 8 || true'

  late-commands:
    - curtin in-target -- apt update
    - curtin in-target -- apt upgrade -y
    # Optional: install TPM and clevis tools for runtime binding
    - curtin in-target -- apt install -y tpm2-tools clevis clevis-luks clevis-initramfs
    - curtin in-target -- update-initramfs -u

  shutdown: reboot
