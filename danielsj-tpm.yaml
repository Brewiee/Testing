#cloud-config
autoinstall:
  version: 1
  interactive-sections: []

  identity:
    hostname: P250253.vito.local
    username: user
    password: "$6$rounds=656000$ADfxhvejGafxsnZv$LMYXLUL.wmjtPmgv.ax1BYQv78Vv1BJQCE9igdCRXMQlM5pBuQyCpskxOTHXUeDr8oChjxLankzZ23wOxfNuR0"

  ssh:
    install-server: false
    allow-pw: false

  locale: "en_US.UTF-8"
  keyboard:
    layout: be
    variant: ""
  timezone: "Europe/Brussels"

  network:
    version: 2
    ethernets:
      eth0:
        match:
          name: "*"
        dhcp4: true
        dhcp6: false

  storage:
    layout:
      name: hybrid
      encrypted: yes

  apt:
    sources:
      main:
        arch: [amd64, i386]
        uri: http://archive.ubuntu.com/ubuntu
        suites: [noble]
        components: [main, restricted, universe]

  # --- TPM setup before partitioning/encryption ---
  early-commands:
    # Ensure TPM tools are available in the installer
    - apt-get update
    - apt-get install -y tpm2-tools
    # Check and prepare TPM
    - bash -c 'tpm2_getcap properties-fixed || echo "TPM not found"'
    - bash -c 'tpm2_clear || true'
    - bash -c 'tpm2_getrandom 8 || true'

  late-commands:
    # Basic updates
    - curtin in-target -- apt update
    - curtin in-target -- apt upgrade -y
    # Install TPM utilities for runtime usage
    - curtin in-target -- apt install -y tpm2-tools clevis clevis-luks clevis-initramfs
    # Bind the LUKS container to the TPM for automatic unlock
    - curtin in-target -- bash -c 'cryptdev=$(lsblk -no NAME,TYPE | grep crypt | awk "{print \$1}" | head -n1); if [ -n "$cryptdev" ]; then systemd-cryptenroll --tpm2-device=auto /dev/$cryptdev || true; fi'
    # Update initramfs so TPM unlock logic is active at boot
    - curtin in-target -- update-initramfs -u

  shutdown: reboot
