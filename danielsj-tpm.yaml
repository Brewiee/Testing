#cloud-config
autoinstall:
  version: 1
  interactive-sections: []

  # Identity (user, host, password)
  identity:
    hostname: P250253.vito.local
    username: user
    password: "$6$rounds=656000$ADfxhvejGafxsnZv$LMYXLUL.wmjtPmgv.ax1BYQv78Vv1BJQCE9igdCRXMQlM5pBuQyCpskxOTHXUeDr8oChjxLankzZ23wOxfNuR0"

  ssh:
    install-server: false
    allow-pw: false

  locale: "en_US.UTF-8"
  keyboard:
    layout: be
    variant: ""
  timezone: "Europe/Brussels"

  network:
    version: 2
    ethernets:
      eth0:
        match:
          name: "*"
        dhcp4: true
        dhcp6: false

  # --- Storage configuration with TPM-backed encryption ---
  storage:
    config:
      - id: disk0
        type: disk
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive
      - id: bios
        type: partition
        device: disk0
        size: 1M
        flag: bios_grub
      - id: efi
        type: partition
        device: disk0
        size: 512M
        flag: boot
        filesystem: fat32
        mount: /boot/efi
      - id: rootpart
        type: partition
        device: disk0
        size: -1
      - id: luksroot
        type: luks
        device: rootpart
        wipe: superblock
        preserve: false
        # TPM2 integration: this tells curtin to set up a LUKS volume
        # whose key is sealed with the TPM rather than only a passphrase.
        tpm2: true
        label: cryptroot
      - id: rootfs
        type: format
        fstype: ext4
        volume: luksroot
        mount: /

  apt:
    sources:
      main:
        arch: [amd64, i386]
        uri: http://archive.ubuntu.com/ubuntu
        suites: [noble]
        components: [main, restricted, universe]

  # --- Ensure TPM tools and Clevis are installed, and bind the LUKS slot to TPM2 ---
  late-commands:
    - curtin in-target -- apt update
    - curtin in-target -- apt install -y tpm2-tools clevis clevis-luks clevis-initramfs
    # Bind the encrypted root volume to the TPM (slot 1)
    - curtin in-target -- bash -c 'cryptdev=$(lsblk -no UUID /dev/mapper/cryptroot); echo "Binding LUKS volume $cryptdev to TPM2..."; clevis luks bind -d /dev/disk/by-uuid/$cryptdev tpm2 "{}"'
    - curtin in-target -- update-initramfs -u
    - curtin in-target -- apt upgrade -y

  shutdown: reboot
