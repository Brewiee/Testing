#cloud-config
autoinstall:
  version: 1
  interactive-sections: []

  identity:
    hostname: P250253.vito.local
    username: user
    password: "$6$rounds=656000$ADfxhvejGafxsnZv$LMYXLUL.wmjtPmgv.ax1BYQv78Vv1BJQCE9igdCRXMQlM5pBuQyCpskxOTHXUeDr8oChjxLankzZ23wOxfNuR0"

  ssh:
    install-server: false
    allow-pw: false

  locale: en_US.UTF-8
  
  keyboard:
    layout: be
    variant: ""
    
  timezone: Europe/Brussels

  network:
    version: 2
    ethernets:
      eth0:
        match:
          name: "*"
        dhcp4: true
        dhcp6: false

  storage:
    layout:
      name: lvm
      match:
        size: largest
      password: ""
    
  packages:
    - tpm2-tools
    - clevis
    - clevis-luks
    - clevis-initramfs
    - cryptsetup

  late-commands:
    - curtin in-target -- apt update
    - curtin in-target -- apt install -y tpm2-tools clevis clevis-luks clevis-initramfs cryptsetup
    - curtin in-target -- bash -c 'rootdev=$(lsblk -no PKNAME /dev/mapper/ubuntu--vg-ubuntu--lv 2>/dev/null | head -n1); if [ -n "$rootdev" ]; then luksdev=$(lsblk -no NAME,TYPE | grep crypt | awk "{print \$1}" | head -n1); if [ -n "$luksdev" ]; then echo "" | clevis luks bind -d /dev/$luksdev tpm2 "{}"; fi; fi'
    - curtin in-target -- update-initramfs -u -k all
    - curtin in-target -- apt upgrade -y

  user-data:
    disable_root: true
    
  shutdown: reboot
