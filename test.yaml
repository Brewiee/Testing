#cloud-config
autoinstall:
  version: 1
  interactive-sections: []
  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: "$6$rounds=4096$SWCBZgqTOcPSgJEw$pz7Xlpv2Ry3M3J30JMypu/nR9ue4SfWax8.hnK0SAhJQ9bG8R0gp5Qh9UdUBlJo8/R9USSQTig98ahCCGSwb.1"
  network:
    version: 2
    ethernets:
      all:
        match: {name: '*'}
        dhcp4: true
        dhcp6: false
        set-name: eth0
  updates: security
  apt:
    preserve_sources_list: false
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
  storage:
    config:
      - id: disk0
        type: disk
        ptable: gpt
        preserve: true
        grub_device: false
        name: disk0
        match:
          ssd: true
      - id: esp
        type: partition
        device: disk0
        size: 1G
        flag: boot
        number: 1
        wipe: superblock
        grub_device: true
      - id: esp-format
        type: format
        fstype: fat32
        volume: esp
      - id: boot
        type: partition
        device: disk0
        size: 2G
        number: 2
      - id: boot-format
        type: format
        fstype: ext4
        volume: boot
      - id: root-pv
        type: partition
        device: disk0
        size: -1
        number: 3
        wipe: superblock
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [root-pv]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
        wipe: superblock
      - id: luks-root
        type: dm_crypt
        dm_name: luksroot
        volume: lvroot
        key: Testing
      - id: luks-root-fs
        type: format
        fstype: ext4
        volume: luks-root
        label: ROOTFS
      - id: mount-root
        type: mount
        device: luks-root-fs
        path: /
      - id: mount-boot
        type: mount
        device: boot-format
        path: /boot
      - id: mount-esp
        type: mount
        device: esp-format
        path: /boot/efi
  ssh:
    install-server: false
    authorized-keys: []
  packages:
    - curl
  snaps: []
  early-commands:
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    write_files:
      - path: /usr/local/sbin/install_mdatp.sh
        permissions: '0750'
        owner: root:root
        content: |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/install_mdatp.log 2>&1
          echo "[mdatp] Starting installation";
          apt-get update || echo "[mdatp] initial apt update failed (continuing)";
          apt-get install -y curl gnupg ca-certificates || true
          mkdir -p /etc/apt/keyrings
          if [ ! -f /etc/apt/keyrings/microsoft.gpg ]; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg || echo "[mdatp] key fetch failed";
          fi
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" > /etc/apt/sources.list.d/microsoft-prod.list
          apt-get update || echo "[mdatp] repo update failed";
          apt-get install -y mdatp || echo "[mdatp] mdatp install failed";
          ONB64="BASE64_STRING_HERE"
          if [ "$ONB64" != "BASE64_STRING_HERE" ]; then
            echo "[mdatp] Applying onboarding file";
            mkdir -p /etc/opt/microsoft/mdatp
            echo "$ONB64" | base64 -d > /etc/opt/microsoft/mdatp/mdatp_onboard.json 2>> /var/log/install_mdatp.log || echo "[mdatp] base64 decode failed";
            chmod 600 /etc/opt/microsoft/mdatp/mdatp_onboard.json || true
            systemctl restart mdatp || true
          else
            echo "[mdatp] Onboarding placeholder not replaced; skipping registration";
          fi
          if command -v mdatp >/dev/null 2>&1; then
            echo "[mdatp] Health summary:";
            mdatp health 2>&1 | sed 's/^/[mdatp] /' || true
          fi
          echo "[mdatp] Completed";
      - path: /usr/local/sbin/prune_desktop.sh
        permissions: '0750'
        owner: root:root
        content: |
          #!/bin/bash
          # Remove non-essential desktop applications to achieve a lean install.
          set -euo pipefail
          exec > /var/log/prune_desktop.log 2>&1
          echo "[prune] Starting desktop package pruning"
          APT_FLAGS="-y --allow-remove-essential --allow-change-held-packages"
          # Core keep set (avoid removing): cinnamon-core cinnamon-session network-manager xorg firefox
          # Removals (adjust as desired)
          REMOVE_PACKAGES=(
            libreoffice* thunderbird transmission-* hexchat simple-scan rhythmbox shotwell
            cheese celluloid drawing hypnotix pix warpinator webapp-manager xreader xfburn brasero
            # Games and puzzles (GNOME / Cinnamon extras)
            gnome-mahjongg gnome-mines gnome-sudoku aisleriot gnome-chess quadrapassel five-or-more four-in-a-row \
            hitori iagno lightsoff swell-foop tali gnome-tetravex gnome-robots gnome-nibbles gnome-klotski pegsolitaire
          )
          echo "[prune] Listing currently installed candidate game packages (pre-purge):"
          dpkg -l | awk '/^ii/ {print $2}' | grep -E '(^aisleriot$|^gnome-(mahjongg|mines|sudoku|chess|robots|nibbles|klotski|tetravex)$|^quadrapassel$|^five-or-more$|^four-in-a-row$|^hitori$|^iagno$|^lightsoff$|^swell-foop$|^tali$)' || echo "[prune] No GNOME game packages detected"
          echo "[prune] Purging: ${REMOVE_PACKAGES[*]}"
          apt-get update || true
          # Use bash globs expansion manually; ignore failures for patterns that don't match
          for pat in "${REMOVE_PACKAGES[@]}"; do
            echo "[prune] Attempt purge $pat"
            apt-get purge $APT_FLAGS $pat 2>/dev/null || true
          done
          apt-get autoremove -y --purge || true
          apt-get clean || true
          echo "[prune] Remaining GNOME game packages after purge (should be empty or minimal):"
          dpkg -l | awk '/^ii/ {print $2}' | grep -E '(^aisleriot$|^gnome-(mahjongg|mines|sudoku|chess|robots|nibbles|klotski|tetravex)$|^quadrapassel$|^five-or-more$|^four-in-a-row$|^hitori$|^iagno$|^lightsoff$|^swell-foop$|^tali$)' || echo "[prune] None remaining"
          echo "[prune] Disk usage after pruning:"; df -h / | sed 's/^/[prune] /'
          echo "[prune] Completed"
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]
      - [ bash, -c, "/usr/local/sbin/prune_desktop.sh || true" ]
      - [ bash, -c, "/usr/local/sbin/install_mdatp.sh || true" ]
      - [ bash, -c, "apt-get update && apt-get install -y intune-portal || echo 'intune portal install failed' >> /var/log/install_mdatp.log" ]
