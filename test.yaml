#cloud-config
autoinstall:
  version: 1
  locale: en_US
  keyboard:
    layout: be
    variant: period
  timezone: Europe/Brussels
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: $6$k7TWlVyp8t/LHXff$b6kFVr8wXGrSMtmuQ5ns4B.VrlYlbxxGDOEV12wbMYLFDllE7VqYRdjaifRv0f.hjaRyOAf1XjP8DiN6cQHjk/
  updates: security
  ssh:
    install-server: true
    authorized-keys: []
    allow-pw: true
  apt:
    preserve_sources_list: false
  packages: []
  user-data:
    disable_root: true
  storage:
    config:
      - type: disk
        id: disk0
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        name: ''
        grub_device: true
      - type: partition
        id: boot-partition
        device: disk0
        size: 1G
        flag: boot
      - type: partition
        id: crypt-partition
        device: disk0
        size: -1
      - type: filesystem
        id: boot-fs
        device: boot-partition
        format: ext4
        mount:
          point: /boot
          options: ''
      - type: dm_crypt
        id: luks-device
        devices:
          - crypt-partition
        key: |
          AUTOGENERATED-INSECURE-DEMO-KEY
        preserve: false
        luks:
          cipher: aes-xts-plain64
          key_size: 512
      - type: lvm_volgroup
        id: vg0
        devices:
          - luks-device
        name: vg0
      - type: lvm_partition
        id: lv-root
        volgroup: vg0
        size: -1
        name: root
      - type: filesystem
        id: root-fs
        device: lv-root
        format: ext4
        mount:
          point: /
          options: ''
  late-commands:
    - "curtin in-target --target=/target -- bash -c 'set -e; apt-get update; apt-get install -y curl wget gnupg ca-certificates software-properties-common'"
    - "curtin in-target --target=/target -- bash -c 'wget -O /tmp/microsoft.asc https://packages.microsoft.com/keys/microsoft.asc'"
    - "curtin in-target --target=/target -- bash -c 'gpg --dearmor /tmp/microsoft.asc && install -o root -g root -m 644 microsoft.asc.gpg /etc/apt/trusted.gpg.d/microsoft.gpg'"
    - "curtin in-target --target=/target -- bash -c 'echo \"deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main\" > /etc/apt/sources.list.d/microsoft-prod.list'"
    - "curtin in-target --target=/target -- bash -c 'apt-get update && apt-get install -y mdatp'"
    - "curtin in-target --target=/target -- bash -c 'mkdir -p /etc/opt/microsoft/mdatp && echo '{\"tenantId\":\"9e2777ed-8237-4ab9-9278-2c144d6f6da3\",\"placeholder\":true}' > /etc/opt/microsoft/mdatp/mdatp_onboard.json'"
    - "curtin in-target --target=/target -- bash -c 'mdatp health --help >/dev/null 2>&1 || true'"
    - "curtin in-target --target=/target -- bash -c 'echo \"Replace /etc/opt/microsoft/mdatp/mdatp_onboard.json with the real onboarding file, then run: mdatp onboarding install\" > /etc/opt/microsoft/mdatp/POST-INSTALL-README'"
    - "echo \"NOTE: Replace placeholder key or integrate TPM-based unlocking.\" > /target/etc/autoencryption-READTHIS"
