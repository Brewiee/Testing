#cloud-config
autoinstall:
  version: 1
  interactive-sections: []
  locale: en_US
  keyboard:
    layout: be
    variant: period
  timezone: Europe/Brussels
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: $6$I7v1s/MnqlagGJOX$5m0VA1x7LHcQxmPEjgaMbbVaZdzAvOYSoQ5RHLqPOBRD/xcl9Zt36pp06VPqcVvLEUIIHyLgdjU6D6yCEe/xm/
  updates: security
  ssh:
    install-server: true
    authorized-keys: []
    allow-pw: true
  apt:
    preserve_sources_list: false
  packages: []
  user-data:
    disable_root: true
  storage:
    config:
      - type: disk
        id: disk0
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        name: ''
        grub_device: true
      - type: partition
        id: efi-partition
        device: disk0
        size: 550M
        flags: [ boot, esp ]
      - type: filesystem
        id: efi-fs
        device: efi-partition
        format: fat32
        mount:
          point: /boot/efi
          options: ''
      - type: partition
        id: boot-partition
        device: disk0
        size: 1G
      - type: partition
        id: crypt-partition
        device: disk0
        size: -1
      - type: filesystem
        id: boot-fs
        device: boot-partition
        format: ext4
        mount:
          point: /boot
          options: ''
      - type: dm_crypt
        id: luks-device
        devices:
          - crypt-partition
        key: |
          AUTOGENERATED-INSECURE-DEMO-KEY
        preserve: false
        luks:
          cipher: aes-xts-plain64
          key_size: 512
      - type: lvm_volgroup
        id: vg0
        devices:
          - luks-device
        name: vg0
      - type: lvm_partition
        id: lv-root
        volgroup: vg0
        size: -1
        name: root
      - type: filesystem
        id: root-fs
        device: lv-root
        format: ext4
        mount:
          point: /
          options: ''
  late-commands:
    - |
      curtin in-target --target=/target -- bash <<'SCRIPT'
      set -e\napt-get update || true\napt-get install -y curl wget gnupg ca-certificates software-properties-common || true\nwget -O /tmp/microsoft.asc https://packages.microsoft.com/keys/microsoft.asc || true\ngpg --dearmor /tmp/microsoft.asc 2>/dev/null && install -o root -g root -m 644 microsoft.asc.gpg /etc/apt/trusted.gpg.d/microsoft.gpg || true\necho 'deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main' > /etc/apt/sources.list.d/microsoft-prod.list || true\napt-get update || true\napt-get install -y mdatp || true\nmkdir -p /etc/opt/microsoft/mdatp\ncat > /etc/opt/microsoft/mdatp/mdatp_onboard.json <<'J'
      {"tenantId":"9e2777ed-8237-4ab9-9278-2c144d6f6da3","placeholder":true}
      J\necho 'Replace /etc/opt/microsoft/mdatp/mdatp_onboard.json with the real onboarding file, then run: mdatp onboarding install' > /etc/opt/microsoft/mdatp/POST-INSTALL-README || true\nmdatp health --help >/dev/null 2>&1 || true\necho 'NOTE: Replace placeholder key or integrate TPM-based unlocking.' > /etc/autoencryption-READTHIS
      SCRIPT
