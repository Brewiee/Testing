#cloud-config
autoinstall:
  version: 1
  source:
    id: ubuntu-server-minimal
  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys
  timezone: Europe/Brussels
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: $6$u0BTlSiEFlBf7Wnj$IgePkzO9ie8lbLha3axG4aoE/FcA4Sa2tseT5ICJ7OQGFs9uOxDm7RJS5G1UMquz1NnffvQ5O0lu.i7TkY6cy1
  ssh:
    install-server: true
    authorized-keys: []
    allow-pw: true
  apt:
    preserve_sources_list: false
  packages: []
  storage:
    config:
      - type: disk
        id: disk0
        match:
          size: largest
        ptable: gpt
        wipe: superblock-recursive
        preserve: false
        name: ''
        grub_device: true
      - type: partition
        id: efi-partition
        device: disk0
        size: 550M
        flags: [ boot, esp ]
      - type: filesystem
        id: efi-fs
        device: efi-partition
        format: fat32
        mount:
          point: /boot/efi
          options: ''
      - type: partition
        id: boot-partition
        device: disk0
        size: 1G
      - type: partition
        id: crypt-partition
        device: disk0
        size: -1
      - type: filesystem
        id: boot-fs
        device: boot-partition
        format: ext4
        mount:
          point: /boot
          options: ''
      - type: dm_crypt
        id: luks-device
        dm_name: cryptroot
        volume: crypt-partition
        key: AUTOGENERATED-INSECURE-DEMO-KEY
        preserve: false
      - type: lvm_volgroup
        id: vg0
        devices:
          - luks-device
        name: vg0
      - type: lvm_partition
        id: lv-root
        volgroup: vg0
        size: -1
        name: root
      - type: filesystem
        id: root-fs
        device: lv-root
        format: ext4
        mount:
          point: /
          options: ''
  shutdown: reboot
  late-commands:
    - |
      curtin in-target --target=/target -- bash <<'SCRIPT'
      apt-get update || true
      apt-get install -y curl wget gnupg ca-certificates software-properties-common || true
      wget -O /tmp/microsoft.asc https://packages.microsoft.com/keys/microsoft.asc || true
      gpg --dearmor /tmp/microsoft.asc 2>/dev/null && install -o root -g root -m 644 microsoft.asc.gpg /etc/apt/trusted.gpg.d/microsoft.gpg || true
      echo 'deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main' > /etc/apt/sources.list.d/microsoft-prod.list || true
      apt-get update || true
      apt-get install -y mdatp || true
      mkdir -p /etc/opt/microsoft/mdatp
      cat > /etc/opt/microsoft/mdatp/mdatp_onboard.json <<'J'
      {"tenantId":"9e2777ed-8237-4ab9-9275-2c144d6f6da3","placeholder":true}
      J
      echo 'Replace /etc/opt/microsoft/mdatp/mdatp_onboard.json with the real onboarding file, then run: mdatp onboarding install' > /etc/opt/microsoft/mdatp/POST-INSTALL-README || true
      mdatp health --help >/dev/null 2>&1 || true
      echo 'NOTE: Replace placeholder key or integrate TPM-based unlocking.' > /etc/autoencryption-READTHIS
      SCRIPT
