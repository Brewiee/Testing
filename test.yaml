#cloud-config
autoinstall:
  version: 1
  interactive-sections: []
  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: "$6$rounds=4096$SWCBZgqTOcPSgJEw$pz7Xlpv2Ry3M3J30JMypu/nR9ue4SfWax8.hnK0SAhJQ9bG8R0gp5Qh9UdUBlJo8/R9USSQTig98ahCCGSwb.1"
  network:
    version: 2
    ethernets:
      all:
        match: {name: '*'}
        dhcp4: true
        dhcp6: false
        set-name: eth0
  updates: security
  apt:
    preserve_sources_list: false
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
  storage:
    config:
      - id: disk0
        type: disk
        ptable: gpt
        preserve: true
        grub_device: false
        name: disk0
        match:
          ssd: true
      - id: esp
        type: partition
        device: disk0
        size: 1G
        flag: boot
        number: 1
        wipe: superblock
        grub_device: true
      - id: esp-format
        type: format
        fstype: fat32
        volume: esp
      - id: boot
        type: partition
        device: disk0
        size: 2G
        number: 2
      - id: boot-format
        type: format
        fstype: ext4
        volume: boot
      - id: root-pv
        type: partition
        device: disk0
        size: -1
        number: 3
        wipe: superblock
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [root-pv]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
        wipe: superblock
      - id: luks-root
        type: dm_crypt
        dm_name: luksroot
        volume: lvroot
        key: gd05pXC56o6057O9It2v
      - id: luks-root-fs
        type: format
        fstype: ext4
        volume: luks-root
        label: ROOTFS
      - id: mount-root
        type: mount
        device: luks-root-fs
        path: /
      - id: mount-boot
        type: mount
        device: boot-format
        path: /boot
      - id: mount-esp
        type: mount
        device: esp-format
        path: /boot/efi
  ssh:
    install-server: false
    authorized-keys: []
  packages:
    - curl
  snaps: []
  early-commands:
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target apt-get -y install curl gnupg software-properties-common || true
    - curtin in-target --target=/target -- bash -c "mkdir -p /etc/apt/keyrings"
    - curtin in-target --target=/target -- bash -c "curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/microsoft.gpg"
    - curtin in-target --target=/target -- bash -c "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main' > /etc/apt/sources.list.d/microsoft.list"
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target -- bash -c "apt-get install -y mdatp || echo mdatp install failed >> /root/autoinstall.log"
    - curtin in-target --target=/target -- bash -c "if command -v mdatp >/dev/null 2>&1; then mdatp --register --tenant-id 9e2777ed-8237-4ab9-9278-2c144d6f6da3 || echo register failed >> /root/autoinstall.log; fi"
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"
  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]
