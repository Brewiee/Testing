#cloud-config
autoinstall:
  version: 1
  interactive-sections: []
  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: "$6$rounds=4096$SWCBZgqTOcPSgJEw$pz7Xlpv2Ry3M3J30JMypu/nR9ue4SfWax8.hnK0SAhJQ9bG8R0gp5Qh9UdUBlJo8/R9USSQTig98ahCCGSwb.1"
  network:
    version: 2
    ethernets:
      all:
        match: {name: '*'}
        dhcp4: true
        dhcp6: false
        set-name: eth0
  updates: security
  source:
    id: ubuntu-desktop-minimal  # Ensure minimal Desktop selection (vs ubuntu-desktop)
  apt:
    preserve_sources_list: false
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
  storage:
    config:
      - id: disk0
        type: disk
        ptable: gpt
        preserve: true
        grub_device: false
        name: disk0
        match:
          ssd: true
      - id: esp
        type: partition
        device: disk0
        size: 1G
        flag: boot
        number: 1
        wipe: superblock
        grub_device: true
      - id: esp-format
        type: format
        fstype: fat32
        volume: esp
      - id: boot
        type: partition
        device: disk0
        size: 2G
        number: 2
      - id: boot-format
        type: format
        fstype: ext4
        volume: boot
      - id: root-pv
        type: partition
        device: disk0
        size: -1
        number: 3
        wipe: superblock
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [root-pv]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
        wipe: superblock
      - id: luks-root
        type: dm_crypt
        dm_name: luksroot
        volume: lvroot
        key: gd05pXC56o6057O9It2v
      - id: luks-root-fs
        type: format
        fstype: ext4
        volume: luks-root
        label: ROOTFS
      - id: mount-root
        type: mount
        device: luks-root-fs
        path: /
      - id: mount-boot
        type: mount
        device: boot-format
        path: /boot
      - id: mount-esp
        type: mount
        device: esp-format
        path: /boot/efi
  ssh:
    install-server: false
    authorized-keys: []
  packages:
    - curl
  snaps: []
  early-commands:
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    # Defender setup (optional – remove if not needed)
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target apt-get -y install curl gnupg software-properties-common || true
    - curtin in-target --target=/target -- bash -c "mkdir -p /etc/apt/keyrings"
    - curtin in-target --target=/target -- bash -c "curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/microsoft.gpg"
    - curtin in-target --target=/target -- bash -c "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main' > /etc/apt/sources.list.d/microsoft.list"
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target -- bash -c "apt-get install -y mdatp || echo mdatp install failed >> /root/autoinstall.log"
    # Onboarding: place the organization-specific onboarding JSON (replace BASE64_STRING below)
    # 1. Download onboarding package from Microsoft Defender portal (Settings > Endpoints > Onboarding > Linux)
    # 2. Base64 encode mdatp_onboard.json WITHOUT line wraps, e.g. (Linux/macOS): base64 -w0 mdatp_onboard.json
    #    (PowerShell): [Convert]::ToBase64String([IO.File]::ReadAllBytes('mdatp_onboard.json'))
    # 3. Replace BASE64_STRING_HERE with the resulting single-line base64 text.
    # NOTE: Keep this secret out of source control; consider using a CI transformation instead of committing.
    - curtin in-target --target=/target -- bash -c "if command -v mdatp >/dev/null 2>&1 && [ ! -f /etc/opt/microsoft/mdatp/mdatp_onboard.json ]; then \
        ONB64='BASE64_STRING_HERE'; \
        if [ \"$ONB64\" != 'BASE64_STRING_HERE' ]; then \
          mkdir -p /etc/opt/microsoft/mdatp; \
          echo $ONB64 | base64 -d > /etc/opt/microsoft/mdatp/mdatp_onboard.json 2>> /root/autoinstall.log || echo base64 decode failed >> /root/autoinstall.log; \
          chmod 600 /etc/opt/microsoft/mdatp/mdatp_onboard.json; \
        else \
          echo 'Onboarding base64 placeholder not replaced; skipping onboarding file' >> /root/autoinstall.log; \
        fi; \
      fi"
    # Restart service to pick up onboarding file (safe if not yet installed)
    - curtin in-target --target=/target -- bash -c "systemctl restart mdatp 2>> /root/autoinstall.log || true"
    # Log Defender health indicators (licensed & real-time protection status)
    - curtin in-target --target=/target -- bash -c "if command -v mdatp >/dev/null 2>&1; then echo 'mdatp healthy='$(mdatp health --field healthy 2>/dev/null) >> /root/autoinstall.log; fi"
    - curtin in-target --target=/target -- bash -c "if command -v mdatp >/dev/null 2>&1; then echo 'mdatp licensed='$(mdatp health --field licensed 2>/dev/null) >> /root/autoinstall.log; fi"
    - curtin in-target --target=/target -- bash -c "if command -v mdatp >/dev/null 2>&1; then echo 'mdatp rtp='$(mdatp health --field real_time_protection_enabled 2>/dev/null) >> /root/autoinstall.log; fi"
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"
  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]
