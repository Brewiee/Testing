#cloud-config
# Ubuntu 24.04 Autoinstall: LUKS2 full-disk encryption with keyfile auto-unlock (no TPM)
# Based conceptually on common approach: create random keyfile, add as LUKS keyslot, store in initramfs-only path
# SECURITY: Anyone with physical access who can extract initramfs can obtain the key. Keep a strong passphrase slot for recovery.

autoinstall:
  version: 1
  interactive-sections: []

  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys

  identity:
    hostname: keyfile-autounlock
    username: operator
    password: "$6$rounds=4096$REPLACE$HASH$"

  network:
    version: 2
    ethernets:
      lan:
        dhcp4: true
        dhcp6: false
        optional: true

  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu

  shutdown: reboot

  storage:
    config:
      - id: disk0
        type: disk
        path: /dev/nvme0n1
        ptable: gpt
        wipe: superblock-recursive
      - id: part-esp
        type: partition
        device: disk0
        size: 600M
        flag: boot
        grub_device: true
      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: fat32
      - id: part-boot
        type: partition
        device: disk0
        size: 1G
      - id: fmt-boot
        type: format
        volume: part-boot
        fstype: ext4
      - id: part-crypt
        type: partition
        device: disk0
        size: -1
      - id: luks-root
        type: dm_crypt
        volume: part-crypt
        dm_name: luksroot
        key: INSTALL_PASSPHRASE   # Initial passphrase, rotated later
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [luks-root]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
      - id: fs-root
        type: format
        volume: lvroot
        fstype: ext4
        label: ROOTFS
      - id: mnt-root
        type: mount
        device: fs-root
        path: /
      - id: mnt-boot
        type: mount
        device: fmt-boot
        path: /boot
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi

  early-commands:
    - |
      # Ensure only one internal non-removable disk (safety)
      d=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      c=$(echo "$d" | wc -w)
      if [ "$c" -ne 1 ]; then echo "ABORT wrong disk count: $c $d" >&2; exit 1; fi

  late-commands:
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target apt-get -y install cryptsetup-bin || true
    - |
      # Create keyfile, add to LUKS, restrict permissions, embed via initramfs
      curtin in-target --target=/target -- bash -c '
        set -euo pipefail
        LOG=/root/keyfile-autounlock.log
        echo "[keyfile] start $(date -u +%FT%TZ)" > "$LOG"
        LUKSDEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
        if [ -z "$LUKSDEV" ] || [ ! -b "$LUKSDEV" ]; then echo "[keyfile] luks_device_not_found" >> "$LOG"; exit 0; fi
        KEYDIR=/root/crypt-keys
        mkdir -p "$KEYDIR"
        chmod 700 "$KEYDIR"
        KEYFILE=$KEYDIR/root.key
        if [ ! -f "$KEYFILE" ]; then
          dd if=/dev/urandom of="$KEYFILE" bs=64 count=1 status=none
          chmod 600 "$KEYFILE"
          echo "[keyfile] generated" >> "$LOG"
        else
          echo "[keyfile] reused_existing" >> "$LOG"
        fi
        # Add keyfile as new keyslot (requires original passphrase)
        echo -n INSTALL_PASSPHRASE | cryptsetup luksAddKey "$LUKSDEV" "$KEYFILE" --key-file - && echo "[keyfile] luksAddKey_ok" >> "$LOG" || echo "[keyfile] luksAddKey_failed" >> "$LOG"
        # Update crypttab to use keyfile path so initramfs picks it up
        if grep -q '^luksroot' /etc/crypttab; then
          sed -i "s#^luksroot[[:space:]].*#luksroot UUID=$(blkid -s UUID -o value $LUKSDEV) $KEYFILE luks#" /etc/crypttab
          echo "[keyfile] crypttab_updated" >> "$LOG"
        fi
        update-initramfs -u -k all >> "$LOG" 2>&1 || echo "[keyfile] initramfs_update_warn" >> "$LOG"
        echo "[keyfile] done" >> "$LOG"'
    - curtin in-target --target=/target systemctl enable fstrim.timer || true

  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    timezone: Europe/Brussels
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

# Post-install steps:
# 1. Confirm unattended boot works (initramfs uses keyfile).
# 2. Rotate install passphrase (still present in an earlier slot): cryptsetup luksChangeKey <LUKSDEV>
# 3. (Optional) Remove passphrase slot only if acceptable risk; keyfile alone weakens security if attacker extracts initramfs.
# 4. Securely escrow the rotated passphrase in a vault.
# 5. Consider migrating later to TPM-based token for stronger hardware binding.
