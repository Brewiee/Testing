## Ubuntu 24.04 Autoinstall: LUKS2 full-disk with TPM2 clevis auto-unlock (first boot bind)
## Flow: Install with temporary passphrase 'Testing' -> first boot systemd service binds clevis tpm2 -> subsequent boots auto-unlock.
## Harden later: rotate passphrase, specify PCR set, enable Secure Boot + signed UKI.

autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard: {layout: be, variant: nodeadkeys}
  identity:
    hostname: p250253.vito.local
    username: ubuntu
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys: []
  network: {version: 2, ethernets: {}}
  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
  storage:
    config:
      - id: disk0
        type: disk
        path: /dev/nvme0n1
        ptable: gpt
        wipe: superblock-recursive
      - id: part-esp
        type: partition
        device: disk0
        size: 600M
        flag: boot
        grub_device: true
      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: fat32
      - id: part-boot
        type: partition
        device: disk0
        size: 1G
      - id: fmt-boot
        type: format
        volume: part-boot
        fstype: ext4
      - id: part-crypt
        type: partition
        device: disk0
        size: -1
      - id: luks-root
        type: dm_crypt
        volume: part-crypt
        dm_name: luksroot
        key: Testing
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [luks-root]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
      - id: fs-root
        type: format
        volume: lvroot
        fstype: ext4
      - id: mnt-root
        type: mount
        device: fs-root
        path: /
      - id: mnt-boot
        type: mount
        device: fmt-boot
        path: /boot
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi
  packages:
    - cryptsetup-bin
    - clevis
    - clevis-luks
    - clevis-initramfs
    - clevis-tpm2
    - tpm2-tools
  snaps: []
  early-commands:
    - |
      internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      cnt=$(echo $internal | wc -w)
      if [ $cnt -ne 1 ]; then echo "ABORT wrong disk count: $cnt $internal" >&2; exit 1; fi
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
    - |
      cat > /etc/apt/apt.conf.d/80-retries <<'EOF'
      Acquire::Retries "10";
      Acquire::http::Retry-5xx "true";
      Acquire::https::Retry-5xx "true";
      Acquire::http::Pipeline-Depth "0";
      Acquire::http::No-Cache "true";
      Acquire::Languages "none";
      EOF
  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - |
      curtin in-target --target=/target -- bash -c "cat > /root/tpm-clevis-bind.sh <<'EOF'
      #!/bin/bash
      # One-time TPM2 Clevis binding script. Runs at first full boot (not during installer live environment)
      # Creates a clevis TPM2 token for the root LUKS container so future boots auto-unlock.
      set -euo pipefail
      PATH=/usr/sbin:/sbin:/usr/bin:/bin
      LOG=/root/tpm-clevis-bind.log
      exec > >(tee -a "$LOG") 2>&1
      echo '[tpm-bind] start'
      # Idempotence: if marker exists OR clevis token already present, exit quickly.
      if [ -f /root/.tpm_clevis_bound ]; then
        echo '[tpm-bind] marker_present_exiting'; exit 0; fi
      # Find LUKS root device: prefer crypttab UUID then fallback blkid first crypto_LUKS.
      DEV="$(grep ^luksroot /etc/crypttab | awk '{gsub("UUID=","",$2);print $2}' | xargs -r -I{} readlink -f /dev/disk/by-uuid/{} 2>/dev/null || true)"
      [ -z "$DEV" ] && DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then echo '[tpm-bind] no_luks_device'; exit 0; fi
      echo '[tpm-bind] device='"$DEV"
      # Already bound?
      if cryptsetup luksDump "$DEV" | grep -q 'type: clevis'; then
        echo '[tpm-bind] already_bound'; touch /root/.tpm_clevis_bound; exit 0; fi
      # TPM readiness (retry loop)
      ok=0
      for i in {1..10}; do
        if tpm2_pcrread sha256:0 >/dev/null 2>&1; then ok=1; break; fi
        echo "[tpm-bind] tpm_not_ready_retry_$i"; sleep 2;
      done
      if [ $ok -ne 1 ]; then echo '[tpm-bind] tpm_unavailable'; exit 1; fi
      # Recovery passphrase (already set as install key). Retain a copy for rotation phase.
      PASS='Testing'
      install -m600 /dev/stdin /root/recovery-luks-passphrase.txt <<<"$PASS"
      # Perform binding (default PCR policy; later you can restrict) using stdin for passphrase.
      if echo -n "$PASS" | clevis luks bind -f -k - -d "$DEV" tpm2 '{}' -y; then
        echo '[tpm-bind] clevis_bind_ok'
      else
        echo '[tpm-bind] clevis_bind_failed'; exit 1
      fi
      # Normalize crypttab (no keyfile -> 'none', ensure luks, add discard)
      if grep -q '^luksroot' /etc/crypttab; then
        awk 'BEGIN{OFS=" "} /^luksroot/ { if($3==""||$3=="-"||$3=="none") $3="none"; if($4==""||$4=="-"||$4=="none") $4="luks"; if($4!~/luks/) $4="luks,"$4; if($4!~/discard/) $4=$4",discard"; gsub(/,,+/,",",$4); sub(/,$/,"",$4); print $1,$2,$3,$4; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab
        echo '[tpm-bind] crypttab_normalized'
      fi
      # Regenerate initramfs so clevis hook + token included.
      if update-initramfs -u -k all; then
        echo '[tpm-bind] initramfs_updated'
      else
        echo '[tpm-bind] initramfs_update_failed'
      fi
      cryptsetup luksDump "$DEV" | awk '/Keyslot [0-9]+:/' || true
      touch /root/.tpm_clevis_bound
      echo '[tpm-bind] done_success'
      EOF
      chmod 700 /root/tpm-clevis-bind.sh"
    - |
      curtin in-target --target=/target -- bash -c "cat > /etc/systemd/system/tpm-clevis-bind.service <<'EOF'
      [Unit]
      Description=One-time TPM2 Clevis bind for root LUKS (first boot)
      After=multi-user.target
      ConditionPathExists=/root/tpm-clevis-bind.sh
      # Service disables itself after success.
      [Service]
      Type=oneshot
      ExecStart=/root/tpm-clevis-bind.sh
      ExecStartPost=/bin/systemctl disable tpm-clevis-bind.service
      RemainAfterExit=no
      [Install]
      WantedBy=multi-user.target
      EOF"
    - curtin in-target --target=/target systemctl enable tpm-clevis-bind.service || true
    - curtin in-target --target=/target -- bash -c "sed -i 's/^ *#* *issue_discards *=.*/    issue_discards = 1/' /etc/lvm/lvm.conf || true"
    - curtin in-target --target=/target systemctl enable fstrim.timer || true
    - |
      curtin in-target --target=/target -- bash -c 'cp /etc/fstab /etc/fstab.orig || true; awk '\''$2=="/"{ if($4!~/noatime/){$4=$4",noatime,lazytime"} } {print}'\'' /etc/fstab > /etc/fstab.new && mv /etc/fstab.new /etc/fstab || true'
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"
  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

## Post-install:
## 1. Reboot twice to confirm unattended unlock.
## 2. Rotate passphrase (add new, remove 'Testing').
## 3. Optionally set specific PCRs: modify tpm-clevis-bind.sh clevis JSON.
## 4. Consider Secure Boot + signed UKI for tamper resistance.
