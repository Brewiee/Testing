## Ubuntu 24.04 Autoinstall: LUKS2 full-disk encryption (manual passphrase at boot)
## Flow: Install with LUKS passphrase 'Testing' (placeholder) -> system prompts at each boot.
## Harden later: change passphrase, add TPM-based auto-unlock or keyfile if desired, Secure Boot + UKI.

autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard: {layout: be, variant: nodeadkeys}
  identity:
    hostname: p250253.vito.local
    username: ubuntu
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys: []
  network: {version: 2, ethernets: {}}
  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
  storage:
    config:
      - id: disk0
        type: disk
        path: /dev/nvme0n1
        ptable: gpt
        wipe: superblock-recursive
      - id: part-esp
        type: partition
        device: disk0
        size: 600M
        flag: boot
        grub_device: true
      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: fat32
      - id: part-boot
        type: partition
        device: disk0
        size: 1G
      - id: fmt-boot
        type: format
        volume: part-boot
        fstype: ext4
      - id: part-crypt
        type: partition
        device: disk0
        size: -1
      - id: luks-root
        type: dm_crypt
        volume: part-crypt
        dm_name: luksroot
        key: Testing
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [luks-root]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
      - id: fs-root
        type: format
        volume: lvroot
        fstype: ext4
      - id: mnt-root
        type: mount
        device: fs-root
        path: /
      - id: mnt-boot
        type: mount
        device: fmt-boot
        path: /boot
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi
  packages:
    - cryptsetup-bin
  snaps: []
  early-commands:
    - |
      internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      cnt=$(echo $internal | wc -w)
      if [ $cnt -ne 1 ]; then echo "ABORT wrong disk count: $cnt $internal" >&2; exit 1; fi
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
    - |
      cat > /etc/apt/apt.conf.d/80-retries <<'EOF'
      Acquire::Retries "10";
      Acquire::http::Retry-5xx "true";
      Acquire::https::Retry-5xx "true";
      Acquire::http::Pipeline-Depth "0";
      Acquire::http::No-Cache "true";
      Acquire::Languages "none";
      EOF
  late-commands:
    - |
      curtin in-target --target=/target -- bash -c '
        set -euo pipefail
        echo "[mdatp] Adding Microsoft repo"
        install -d -m 0755 /etc/apt/keyrings
        curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
        chmod 0644 /etc/apt/keyrings/microsoft.gpg
        echo "deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" > /etc/apt/sources.list.d/microsoft-prod.list
        apt-get update
        echo "[mdatp] Installing package"
        DEBIAN_FRONTEND=noninteractive apt-get install -y mdatp
        mkdir -p /etc/opt/microsoft/mdatp/managed
        printf %s '{"tenantId":"9e2777ed-8237-4ab9-9278-2c144d6f6da3"}' > /etc/opt/microsoft/mdatp/managed/mdatp_onboard.json
        chmod 0600 /etc/opt/microsoft/mdatp/managed/mdatp_onboard.json || true
        systemctl restart mdatp || true
        echo "[mdatp] Post-install status:" >> /root/autoinstall.log
        mdatp health json 2>/dev/null >> /root/autoinstall.log || true
      '
  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

## Post-install suggestions:
## - Change the temporary passphrase 'Testing' immediately: cryptsetup luksChangeKey /dev/nvme0n1p3
## - Consider adding TPM-based auto-unlock later (systemd-cryptenroll --tpm2-device=auto ...).
## - Optionally enable discard: ensure crypttab entry has 'discard' if needed.
## - For improved integrity, adopt Secure Boot + unified kernel image.
