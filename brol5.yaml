## Ubuntu 24.04 Autoinstall: LUKS2 full-disk with TPM2 clevis auto-unlock (first boot bind)
## Flow: Install with temporary passphrase 'Testing' -> first boot systemd service binds clevis tpm2 -> subsequent boots auto-unlock.
## Harden later: rotate passphrase, specify PCR set, enable Secure Boot + signed UKI.

autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard: {layout: be, variant: nodeadkeys}
  identity:
    hostname: p250253.vito.local
    username: ubuntu
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys: []
  network: {version: 2, ethernets: {}}
  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
  storage:
    config:
      - id: disk0
        type: disk
        path: /dev/nvme0n1
        ptable: gpt
        wipe: superblock-recursive
      - id: part-esp
        type: partition
        device: disk0
        size: 600M
        flag: boot
        grub_device: true
      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: fat32
      - id: part-boot
        type: partition
        device: disk0
        size: 1G
      - id: fmt-boot
        type: format
        volume: part-boot
        fstype: ext4
      - id: part-crypt
        type: partition
        device: disk0
        size: -1
      - id: luks-root
        type: dm_crypt
        volume: part-crypt
        dm_name: luksroot
        key: Testing
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [luks-root]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
      - id: fs-root
        type: format
        volume: lvroot
        fstype: ext4
      - id: mnt-root
        type: mount
        device: fs-root
        path: /
      - id: mnt-boot
        type: mount
        device: fmt-boot
        path: /boot
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi
  packages:
    - cryptsetup-bin
  snaps: []
  early-commands:
    - |
      internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      cnt=$(echo $internal | wc -w)
      if [ $cnt -ne 1 ]; then echo "ABORT wrong disk count: $cnt $internal" >&2; exit 1; fi
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
    - |
      cat > /etc/apt/apt.conf.d/80-retries <<'EOF'
      Acquire::Retries "10";
      Acquire::http::Retry-5xx "true";
      Acquire::https::Retry-5xx "true";
      Acquire::http::Pipeline-Depth "0";
      Acquire::http::No-Cache "true";
      Acquire::Languages "none";
      EOF
  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - |
      curtin in-target --target=/target -- bash -c '
        set -euo pipefail
        DEV=$(grep ^luksroot /etc/crypttab | awk "{gsub(\"UUID=\",\"\",$2);print $2}" | xargs -r -I{} readlink -f /dev/disk/by-uuid/{} 2>/dev/null || true)
        [ -z "$DEV" ] && DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
        if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then echo "[keyfile] no_luks_device"; exit 1; fi
        echo "[keyfile] device=$DEV"
        if [ ! -f /boot/keyfile ]; then
          dd if=/dev/urandom of=/boot/keyfile bs=1024 count=4
          chmod 0400 /boot/keyfile
          echo "[keyfile] created /boot/keyfile"
        fi
        if ! cryptsetup luksDump "$DEV" | grep -q /boot/keyfile; then
          cryptsetup luksAddKey "$DEV" /boot/keyfile --key-file - <<< "Testing"
          echo "[keyfile] keyfile added to LUKS"
        fi
        UUID=$(blkid -s UUID -o value "$DEV")
        sed -i "/^luksroot /d" /etc/crypttab
        echo "luksroot UUID=$UUID /boot/keyfile luks,discard" >> /etc/crypttab
        echo "[keyfile] crypttab updated"
        update-initramfs -u -k all
        echo "[keyfile] initramfs updated"
      '
    - curtin in-target --target=/target -- bash -c "sed -i 's/^ *#* *issue_discards *=.*/    issue_discards = 1/' /etc/lvm/lvm.conf || true"
    - curtin in-target --target=/target systemctl enable fstrim.timer || true
    - |
      curtin in-target --target=/target -- bash -c 'cp /etc/fstab /etc/fstab.orig || true; awk '\''$2=="/"{ if($4!~/noatime/){$4=$4",noatime,lazytime"} } {print}'\'' /etc/fstab > /etc/fstab.new && mv /etc/fstab.new /etc/fstab || true'
    - curtin in-target --target=/target -- bash -c "echo '[late] clevis log:'; tail -n 50 /root/tpm-clevis-bind.log || true"
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"
  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

## Post-install:
## 1. Reboot twice to confirm unattended unlock.
## 2. Rotate passphrase (add new, remove 'Testing').
## 3. Optionally set specific PCRs: modify tpm-clevis-bind.sh clevis JSON.
## 4. Consider Secure Boot + signed UKI for tamper resistance.
