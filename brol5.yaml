##cloud-config
## Ubuntu 24.04 Autoinstall: Full-Disk LUKS2 (partition) -> LVM -> ext4 /, TPM2 auto-unlock via Clevis
## Goals:
##  - Fully unattended install
##  - Disk encrypted (LUKS2) with initial passphrase (placeholder) plus TPM2 clevis binding added during install
##  - First normal boot should unlock automatically (TPM) while retaining original passphrase for recovery
##  - No Microsoft Defender (mdatp) components installed
##  - Minimal extra logic; easy to audit
## SECURITY NOTE: Replace the placeholder LUKS passphrase BEFORE production use. After validating TPM unlock twice, optionally remove the passphrase keyslot.

autoinstall:
  version: 1
  interactive-sections: []

  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys

  identity:
    hostname: encrypted-workstation
    username: pcinstall
    # Password hash for user pcinstall (example only). Generate your own:
    # mkpasswd --method=SHA-512
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"

  network:
    version: 2
    ethernets:
      lan:
        match: { name: "en*" }
        dhcp4: true
        dhcp6: false
        optional: true

  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu

  shutdown: reboot

  # Storage layout: ESP /boot / (LUKS2 partition -> LVM VG -> LV root)
  storage:
    config:
      - id: disk0
        type: disk
        path: /dev/nvme0n1          # Adjust if different hardware (e.g., /dev/sda)
        ptable: gpt
        wipe: superblock-recursive

      - id: part-esp
        type: partition
        device: disk0
        size: 600M
        flag: boot
        grub_device: true

      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: fat32

      - id: part-boot
        type: partition
        device: disk0
        size: 1G

      - id: fmt-boot
        type: format
        volume: part-boot
        fstype: ext4

      - id: part-crypt
        type: partition
        device: disk0
        size: -1

      - id: luks-root
        type: dm_crypt
        volume: part-crypt
        dm_name: luksroot              # Will appear in /etc/crypttab
        # Plaintext passphrase (placeholder!) needed for unattended provisioning.
        # CHANGE THIS VALUE – do NOT ship this in production images.
        key: Testing
        # pbkdf, cipher, etc., can be tuned (defaults acceptable for most cases)

      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [luks-root]

      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1

      - id: fs-root
        type: format
        volume: lvroot
        fstype: ext4
        label: ROOTFS

      - id: mnt-root
        type: mount
        device: fs-root
        path: /
      - id: mnt-boot
        type: mount
        device: fmt-boot
        path: /boot
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi

  ssh:
    install-server: false
    authorized-keys: []

  packages:
    - curl

  snaps: []

  early-commands:
    - |
      # Ensure only one internal (non-removable, non-USB) disk to avoid wiping wrong device
      internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      cnt=$(echo $internal | wc -w)
      if [ $cnt -ne 1 ]; then
        echo "ABORT: expected exactly one internal disk, found $cnt: $internal" >&2
        exit 1
      fi
    - |
      # Wait for network link (max 60s)
      for i in $(seq 1 30); do ip link show | grep -q 'state UP' && break; sleep 2; done
    - sed -i "s/^#*PermitRootLogin.*/PermitRootLogin no/" /etc/ssh/sshd_config || true
    - |
      # Improve apt robustness (live environment)
      echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries

  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target apt-get -y install clevis clevis-luks clevis-initramfs clevis-tpm2 tpm2-tools cryptsetup-bin || true
    - |
      # Attempt clevis binding already inside installer (for first-boot unlock). If TPM not ready, fallback service will bind.
      curtin in-target --target=/target -- bash -c 'cat > /root/clevis-install-bind.sh <<"EOS"
      #!/bin/bash
      set -euo pipefail
      LOG=/root/clevis-install-bind.log
      PASS="Testing"   # MUST match storage.luks-root.key (change both in production)
      echo "[install-bind] start" | tee -a "$LOG"
      DEV="$(grep ^luksroot /etc/crypttab | awk "{gsub(\"UUID=\",\"\",\$2);print \$2}" | xargs -I{} readlink -f /dev/disk/by-uuid/{} 2>/dev/null || true)"
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
        DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      fi
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
        echo "[install-bind] no_device" | tee -a "$LOG"; exit 0
      fi
      echo "[install-bind] device=$DEV" | tee -a "$LOG"
      if cryptsetup luksDump "$DEV" | grep -q "type: clevis"; then
        echo "[install-bind] already_bound" | tee -a "$LOG"; exit 0
      fi
      if [ -e /dev/tpmrm0 ] && tpm2_pcrread sha256:0 >/dev/null 2>&1; then
        echo "[install-bind] tpm_ok" | tee -a "$LOG"
        if echo -n "$PASS" | clevis luks bind -f -k - -d "$DEV" tpm2 '{}' -y >>"$LOG" 2>&1; then
          echo "$PASS" > /root/recovery-luks-passphrase.txt
          chmod 600 /root/recovery-luks-passphrase.txt
          sed -i -E 's/,?tpm2-device=[^,[:space:]]*//g' /etc/crypttab || true
          if grep -q '^luksroot' /etc/crypttab; then
            awk 'BEGIN{OFS=" "} /^luksroot/ { if($3==""||$3=="-"||$3=="none") $3="none"; if($4==""||$4=="-"||$4=="none") $4="luks"; if($4!~/luks/) $4="luks,"$4; if($4!~/discard/) $4=$4",discard"; gsub(/,,+/,",",$4); print $1,$2,$3,$4; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab
          fi
          update-initramfs -u -k all >>"$LOG" 2>&1 || echo "[install-bind] initramfs_warn" | tee -a "$LOG"
          touch /root/clevis-bound-during-install
          echo "[install-bind] success" | tee -a "$LOG"
        else
          echo "[install-bind] clevis_bind_failed" | tee -a "$LOG"
        fi
      else
        echo "[install-bind] tpm_not_ready" | tee -a "$LOG"
      fi
      EOS'
    - curtin in-target --target=/target chmod 700 /root/clevis-install-bind.sh
    - curtin in-target --target=/target -- bash -c "/root/clevis-install-bind.sh || echo install_bind_script_failed >> /root/autoinstall.log"
    - |
      # Write first-boot clevis binding script (TPM available reliably after real boot)
      curtin in-target --target=/target -- bash -c 'cat > /root/tpm-clevis-bind.sh <<"EOS"
      #!/bin/bash
      set -euo pipefail
      LOG=/root/tpm-clevis-bind.log
      echo "[bind] start" | tee -a "$LOG"
      DEV="$(grep ^luksroot /etc/crypttab | awk "{gsub(\"UUID=\",\"\",\$2);print \$2}" | xargs -I{} readlink -f /dev/disk/by-uuid/{} 2>/dev/null || true)"
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
        DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      fi
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then
        echo "[bind] no_luks_device" | tee -a "$LOG"; exit 0
      fi
      echo "[bind] device=$DEV" | tee -a "$LOG"
      if [ -f /root/clevis-bound-during-install ]; then
        echo "[bind] skip_first_boot_already_bound_install_phase" | tee -a "$LOG"; systemctl disable tpm-clevis-bind.service >/dev/null 2>&1 || true; exit 0
      fi
      if cryptsetup luksDump "$DEV" | grep -q "type: clevis"; then
        echo "[bind] already_has_token" | tee -a "$LOG"; systemctl disable tpm-clevis-bind.service >/dev/null 2>&1 || true; exit 0
      fi
      PASS='Testing'
      echo "$PASS" > /root/recovery-luks-passphrase.txt
      chmod 600 /root/recovery-luks-passphrase.txt
      if echo -n "$PASS" | clevis luks bind -f -k - -d "$DEV" tpm2 '{}' -y >>"$LOG" 2>&1; then
        echo "[bind] clevis_bind_ok" | tee -a "$LOG"
      else
        echo "[bind] clevis_bind_failed" | tee -a "$LOG"; exit 1
      fi
      if grep -q '^luksroot' /etc/crypttab; then
        sed -i -E 's/,?tpm2-device=[^,[:space:]]*//g' /etc/crypttab
        awk 'BEGIN{OFS=" "} /^luksroot/ { if($3==""||$3=="-"||$3=="none") $3="none"; if($4==""||$4=="-"||$4=="none") $4="luks"; if($4!~/luks/) $4="luks,"$4; if($4!~/discard/) $4=$4",discard"; gsub(/,,+/,",",$4); print $1,$2,$3,$4; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab
        echo "[bind] crypttab_normalized" | tee -a "$LOG"
      fi
      update-initramfs -u -k all >>"$LOG" 2>&1 || echo "[bind] initramfs_update_failed" | tee -a "$LOG"
      cryptsetup luksDump "$DEV" | awk '/Keyslot [0-9]+:/' >>"$LOG" || true
      echo "[bind] done" | tee -a "$LOG"
      systemctl disable tpm-clevis-bind.service >/dev/null 2>&1 || true
      EOS'
    - |
      # Systemd unit for first-boot binding
      curtin in-target --target=/target -- bash -c 'cat > /etc/systemd/system/tpm-clevis-bind.service <<EOF
      [Unit]
      Description=One-time TPM Clevis LUKS bind
      After=multi-user.target
      ConditionPathExists=/root/tpm-clevis-bind.sh

      [Service]
      Type=oneshot
      ExecStart=/root/tpm-clevis-bind.sh
      RemainAfterExit=no

      [Install]
      WantedBy=multi-user.target
      EOF'
    - curtin in-target --target=/target chmod 700 /root/tpm-clevis-bind.sh
    - curtin in-target --target=/target systemctl enable tpm-clevis-bind.service || true
    - curtin in-target --target=/target -- bash -c "echo 'Acquire::Retries \"5\";' > /etc/apt/apt.conf.d/80-retries"
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"
    - curtin in-target --target=/target -- bash -c "sed -i 's/^ *#* *issue_discards *=.*/    issue_discards = 1/' /etc/lvm/lvm.conf || true"
    - curtin in-target --target=/target systemctl enable fstrim.timer || true
    - |
      curtin in-target --target=/target -- bash -c '
        cp /etc/fstab /etc/fstab.orig || true
        awk '\''$2=="/"{ if($4!~/noatime/){$4=$4",noatime,lazytime"} } {print}'\'' /etc/fstab > /etc/fstab.new && mv /etc/fstab.new /etc/fstab || true
      '

  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

## POST-INSTALL OPERATOR ACTIONS #############################################
## 1. Confirm unattended boot without passphrase prompt.
## 2. Change user password & lock down sudo: rm /etc/sudoers.d/90-cloud-init-users
## 3. Replace recovery passphrase (optional): cryptsetup luksChangeKey /dev/nvme0n1p3
## 4. (Optional) Remove passphrase slot after two successful TPM unlock boots:
##      cryptsetup luksDump /dev/nvme0n1p3   # identify slot (e.g., 0)
##      cryptsetup luksKillSlot /dev/nvme0n1p3 <slot-number>
## 5. (Optional) Re-bind with PCR policy:
##      echo -n NEWPASS | clevis luks bind -f -k - -d /dev/nvme0n1p3 tpm2 '{"pcr_ids":"0,7"}' -y
## 6. Securely remove /root/recovery-luks-passphrase.txt if policy allows.
###############################################################################
