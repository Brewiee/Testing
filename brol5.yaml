## Ubuntu 24.04 Autoinstall: Full-disk LUKS2 with local keyfile auto-unlock (no TPM, no network)
## Security Trade-off: Key stored on disk (in initramfs) means theft of entire disk gives attacker the key unless Secure Boot + custom signed UKI + measured verification are enforced. Provides protection only against opportunistic access while system is off; not strong against determined offline attacker.
## Improve tamper resistance post-install:
##  - Enable Secure Boot with custom keys; build a Unified Kernel Image embedding initramfs; sign it.
##  - Keep a strong recovery passphrase in a separate safe location.

autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard: {layout: us, variant: ''}
  identity:
    hostname: ubuntu-auto-local
    username: ubuntu
    password: "$6$rounds=4096$6Ank5O0ZsT06zuNX$05o2NnQLO1cMNI4YVvR4o7a+n9u40mbX8ynX98gMs2JMZ6XZ/WHL5NY0W1TUHS/fbyALJWWrhJg6JXvRFn1Jn."
  ssh:
    install-server: true
    allow-pw: false
    authorized-keys: []
  network: {version: 2, ethernets: {}}
  updates: security
  apt:
    preserve_sources_list: false
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu

  storage:
    layout: {name: direct}
    config:
      - type: disk
        id: disk0
        match: {size: '>50G'}
        wipe: superblock-recursive
        ptable: gpt
      - type: partition
        id: efi
        device: disk0
        size: 550M
        flag: boot
        fs: fat32
        mount: {path: /boot/efi}
      - type: partition
        id: boot
        device: disk0
        size: 1G
        fs: ext4
        mount: {path: /boot}
      - type: partition
        id: luks-part
        device: disk0
        size: -1
      - type: luks
        id: luksroot
        devices: [luks-part]
        preserve: false
        cipher: aes-xts-plain64
        keysize: 512
        mode: luks2
        label: cryptroot
        passphrase: Testing   # Placeholder recovery passphrase
      - type: lvm_volgroup
        id: vgroot
        name: vgroot
        devices: [luksroot]
      - type: lvm_partition
        id: lvroot
        volgroup: vgroot
        size: -1
        mount: {path: /}
        fs: ext4

  packages:
    - cryptsetup-bin
    - clevis          # (Optional future use)
    - clevis-luks
    - clevis-initramfs
  snaps: []

  early-commands:
    - |
      internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      cnt=$(echo $internal | wc -w)
      if [ $cnt -ne 1 ]; then echo "ABORT wrong disk count: $cnt $internal" >&2; exit 1; fi
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
    - |
      cat > /etc/apt/apt.conf.d/80-retries <<'EOF'
      Acquire::Retries "10";
      Acquire::http::Retry-5xx "true";
      Acquire::https::Retry-5xx "true";
      Acquire::http::Pipeline-Depth "0";
      Acquire::http::No-Cache "true";
      Acquire::Languages "none";
      EOF

  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - |
      curtin in-target --target=/target -- bash -c 'cat > /root/setup-local-key.sh <<"EOF"
      #!/bin/bash
      set -euo pipefail
      LOG=/root/localkey-setup.log
      echo "[localkey] start" | tee "$LOG"
      DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      if [ -z "$DEV" ]; then echo "[localkey] no_luks_device" | tee -a "$LOG"; exit 0; fi
      KEYDIR=/etc/cryptsetup-keys.d
      KEYFILE=$KEYDIR/luksroot.key
      mkdir -p "$KEYDIR" && chmod 700 "$KEYDIR"
      if [ ! -s "$KEYFILE" ]; then
        umask 077
        head -c 64 /dev/urandom > "$KEYFILE"
        echo "[localkey] keyfile_created" | tee -a "$LOG"
      else
        echo "[localkey] keyfile_exists" | tee -a "$LOG"
      fi
      # Add keyfile as new keyslot if not already
      if ! cryptsetup luksDump "$DEV" | grep -q "luksroot.key"; then
        echo "[localkey] adding keyslot" | tee -a "$LOG"
        echo -n "Testing" | cryptsetup luksAddKey "$DEV" "$KEYFILE" --key-file - >>"$LOG" 2>&1 || echo "[localkey] addkey_failed" | tee -a "$LOG"
      fi
      # Update crypttab to use keyfile (field 3)
      if grep -q '^luksroot' /etc/crypttab; then
        awk 'BEGIN{OFS=" "} /^luksroot/ { $3="'"$KEYFILE"'"; if($4==""||$4=="-"||$4=="none") $4="luks"; if($4!~/luks/) $4="luks,"$4; if($4!~/discard/) $4=$4",discard"; gsub(/,,+/,",",$4); print $1,$2,$3,$4; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab
        echo "[localkey] crypttab_updated" | tee -a "$LOG"
      fi
      update-initramfs -u -k all >>"$LOG" 2>&1 || echo "[localkey] initramfs_update_failed" | tee -a "$LOG"
      echo "Testing" > /root/recovery-luks-passphrase.txt; chmod 600 /root/recovery-luks-passphrase.txt
      echo "[localkey] done" | tee -a "$LOG"
      EOF'
    - curtin in-target --target=/target chmod 700 /root/setup-local-key.sh
    - curtin in-target --target=/target -- bash -c '/root/setup-local-key.sh || true'
    - curtin in-target --target=/target -- bash -c "sed -i 's/^ *#* *issue_discards *=.*/    issue_discards = 1/' /etc/lvm/lvm.conf || true"
    - curtin in-target --target=/target systemctl enable fstrim.timer || true
    - |
      curtin in-target --target=/target -- bash -c 'cp /etc/fstab /etc/fstab.orig || true; awk '\''$2=="/"{ if($4!~/noatime/){$4=$4",noatime,lazytime"} } {print}'\'' /etc/fstab > /etc/fstab.new && mv /etc/fstab.new /etc/fstab || true'
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"

  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

## Post-install (manual, recommend):
## 1. Rotate recovery passphrase: cryptsetup luksAddKey /dev/<luksdev>; cryptsetup luksKillSlot /dev/<luksdev> <oldslot>
## 2. Build signed UKI so attacker cannot modify initramfs/key without your signing key.
## 3. Restrict physical access; consider moving to TPM-backed solution once hardware issue resolved.
