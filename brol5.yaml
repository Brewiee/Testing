##cloud-config
## Fresh rebuilt Ubuntu 24.04 Autoinstall: LUKS2 -> LVM -> ext4 with TPM2 Clevis auto-unlock.
## WARNING: Replace passphrase 'Testing' before production use.

autoinstall:
  version: 1

  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys

  identity:
    hostname: encrypted-workstation
    username: pcinstall
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"

  network:
    version: 2
    ethernets:
      lan:
        match: { name: "en*" }
        dhcp4: true
        dhcp6: false
        optional: true

  updates: security
  apt:
    # Primary archive mirror
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu
    # Explicit security pocket pointing to archive (workaround when security.ubuntu.com intermittently 500s)
    sources:
      ubuntu-security:
        source: deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse

  shutdown: reboot

  storage:
    config:
      - id: disk0
        type: disk
        path: /dev/nvme0n1
        ptable: gpt
        wipe: superblock-recursive
      - id: part-esp
        type: partition
        device: disk0
        size: 600M
        flag: boot
        grub_device: true
      - id: fmt-esp
        type: format
        volume: part-esp
        fstype: fat32
      - id: part-boot
        type: partition
        device: disk0
        size: 1G
      - id: fmt-boot
        type: format
        volume: part-boot
        fstype: ext4
      - id: part-crypt
        type: partition
        device: disk0
        size: -1
      - id: luks-root
        type: dm_crypt
        volume: part-crypt
        dm_name: luksroot
        key: Testing
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [luks-root]
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1
      - id: fs-root
        type: format
        volume: lvroot
        fstype: ext4
        label: ROOTFS
      - id: mnt-root
        type: mount
        device: fs-root
        path: /
      - id: mnt-boot
        type: mount
        device: fmt-boot
        path: /boot
      - id: mnt-esp
        type: mount
        device: fmt-esp
        path: /boot/efi

  ssh:
    install-server: false
    authorized-keys: []

  packages:
    - curl

  snaps: []

  early-commands:
    - |
      internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
      cnt=$(echo $internal | wc -w)
      if [ $cnt -ne 1 ]; then echo "ABORT wrong disk count: $cnt $internal" >&2; exit 1; fi
    - |
      for i in $(seq 1 30); do ip link show | grep -q 'state UP' && break; sleep 2; done
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true
    - |
      cat > /etc/apt/apt.conf.d/80-retries <<'EOF'
      Acquire::Retries "10";
      Acquire::http::Retry-5xx "true";
      Acquire::https::Retry-5xx "true";
      Acquire::http::Pipeline-Depth "0";
      Acquire::http::No-Cache "true";
      Acquire::Languages "none";
      EOF

  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - |
      curtin in-target --target=/target -- bash -c 'cat > /root/install-clevis-packages.sh <<"EOF"
      #!/bin/bash
      set -euo pipefail
      LOG=/root/clevis-pkg-install.log
      echo "[clevis-pkgs] start" > "$LOG"
      PKGS=(clevis clevis-luks clevis-initramfs clevis-tpm2 tpm2-tools cryptsetup-bin)
      # Retry loop to mitigate transient 500 / mirror hiccups
      for attempt in {1..8}; do
        echo "[clevis-pkgs] attempt $attempt" | tee -a "$LOG"
        if DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=10 -y install "${PKGS[@]}" >>"$LOG" 2>&1; then
          echo "[clevis-pkgs] success" | tee -a "$LOG"
          exit 0
        fi
        sleep $((attempt*5))
      done
      echo "[clevis-pkgs] failed_after_retries" | tee -a "$LOG"
      # Do not hard fail install; clevis fallback service may still install later via manual intervention.
      exit 0
      EOF'
    - curtin in-target --target=/target chmod 700 /root/install-clevis-packages.sh
    - curtin in-target --target=/target -- bash -c '/root/install-clevis-packages.sh || true'
    - |
      curtin in-target --target=/target -- bash -c 'cat > /root/clevis-install-bind.sh <<'"'"'EOF'"'"'
      #!/bin/bash
      set -euo pipefail
      LOG=/root/clevis-install-bind.log
      PASS="Testing"
      echo "[install-bind] start" | tee -a "$LOG"
      if ! command -v clevis >/dev/null 2>&1; then echo "[install-bind] clevis_not_installed" | tee -a "$LOG"; exit 0; fi
      if ! command -v tpm2_pcrread >/dev/null 2>&1; then echo "[install-bind] tpm2_tools_missing" | tee -a "$LOG"; exit 0; fi
      DEV="$(grep ^luksroot /etc/crypttab | awk '{gsub("UUID=","",$2);print $2}' | xargs -I{} readlink -f /dev/disk/by-uuid/{} 2>/dev/null || true)"
      [ -z "$DEV" ] && DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then echo "[install-bind] no_device" | tee -a "$LOG"; exit 0; fi
      echo "[install-bind] device=$DEV" | tee -a "$LOG"
      if cryptsetup luksDump "$DEV" | grep -q "type: clevis"; then echo "[install-bind] already_bound" | tee -a "$LOG"; exit 0; fi
      if [ -e /dev/tpmrm0 ] && tpm2_pcrread sha256:0 >/dev/null 2>&1; then
        echo "[install-bind] tpm_ok" | tee -a "$LOG"
        if echo -n "$PASS" | clevis luks bind -f -k - -d "$DEV" tpm2 '{}' -y >>"$LOG" 2>&1; then
          echo "$PASS" > /root/recovery-luks-passphrase.txt; chmod 600 /root/recovery-luks-passphrase.txt
          sed -i -E 's/,?tpm2-device=[^,[:space:]]*//g' /etc/crypttab || true
          if grep -q '^luksroot' /etc/crypttab; then
            awk 'BEGIN{OFS=" " } /^luksroot/ { if($3==""||$3=="-"||$3=="none") $3="none"; if($4==""||$4=="-"||$4=="none") $4="luks"; if($4!~/luks/) $4="luks,"$4; if($4!~/discard/) $4=$4",discard"; gsub(/,,+/,",",$4); print $1,$2,$3,$4; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab
          fi
          update-initramfs -u -k all >>"$LOG" 2>&1 || echo "[install-bind] initramfs_warn" | tee -a "$LOG"
          cryptsetup luksDump "$DEV" | awk '/Keyslot [0-9]+:/' >>"$LOG" || true
          touch /root/clevis-bound-during-install
          echo "[install-bind] success" | tee -a "$LOG"
        else
          echo "[install-bind] clevis_bind_failed" | tee -a "$LOG"
        fi
      else
        echo "[install-bind] tpm_not_ready" | tee -a "$LOG"
      fi
      EOF'
    - curtin in-target --target=/target chmod 700 /root/clevis-install-bind.sh
    - curtin in-target --target=/target -- bash -c "/root/clevis-install-bind.sh || echo install_bind_script_failed >> /root/autoinstall.log"
    - curtin in-target --target=/target -- bash -c "[ -f /root/clevis-install-bind.log ] && chmod 600 /root/clevis-install-bind.log || true"
    - |
      curtin in-target --target=/target -- bash -c 'cat > /root/tpm-clevis-bind.sh <<'"'"'EOF'"'"'
      #!/bin/bash
      set -euo pipefail
      LOG=/root/tpm-clevis-bind.log
      echo "[bind] start" | tee -a "$LOG"
      if ! command -v clevis >/dev/null 2>&1; then echo "[bind] clevis_not_installed" | tee -a "$LOG"; exit 0; fi
      if ! command -v tpm2_pcrread >/dev/null 2>&1; then echo "[bind] tpm2_tools_missing" | tee -a "$LOG"; exit 0; fi
      DEV="$(grep ^luksroot /etc/crypttab | awk '{gsub("UUID=","",$2);print $2}' | xargs -I{} readlink -f /dev/disk/by-uuid/{} 2>/dev/null || true)"
      [ -z "$DEV" ] && DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      if [ -z "$DEV" ] || [ ! -b "$DEV" ]; then echo "[bind] no_luks_device" | tee -a "$LOG"; exit 0; fi
      echo "[bind] device=$DEV" | tee -a "$LOG"
      if [ -f /root/clevis-bound-during-install ]; then echo "[bind] skip_first_boot_already_bound_install_phase" | tee -a "$LOG"; systemctl disable tpm-clevis-bind.service >/dev/null 2>&1 || true; exit 0; fi
      if cryptsetup luksDump "$DEV" | grep -q "type: clevis"; then echo "[bind] already_has_token" | tee -a "$LOG"; systemctl disable tpm-clevis-bind.service >/dev/null 2>&1 || true; exit 0; fi
      PASS='Testing'
      echo "$PASS" > /root/recovery-luks-passphrase.txt; chmod 600 /root/recovery-luks-passphrase.txt
      if echo -n "$PASS" | clevis luks bind -f -k - -d "$DEV" tpm2 '{}' -y >>"$LOG" 2>&1; then
        echo "[bind] clevis_bind_ok" | tee -a "$LOG"
      else
        echo "[bind] clevis_bind_failed" | tee -a "$LOG"; exit 1
      fi
      if grep -q '^luksroot' /etc/crypttab; then
        sed -i -E 's/,?tpm2-device=[^,[:space:]]*//g' /etc/crypttab
        awk 'BEGIN{OFS=" "} /^luksroot/ { if($3==""||$3=="-"||$3=="none") $3="none"; if($4==""||$4=="-"||$4=="none") $4="luks"; if($4!~/luks/) $4="luks,"$4; if($4!~/discard/) $4=$4",discard"; gsub(/,,+/,",",$4); print $1,$2,$3,$4; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab
        echo "[bind] crypttab_normalized" | tee -a "$LOG"
      fi
      update-initramfs -u -k all >>"$LOG" 2>&1 || echo "[bind] initramfs_update_failed" | tee -a "$LOG"
      cryptsetup luksDump "$DEV" | awk '/Keyslot [0-9]+:/' >>"$LOG" || true
      echo "[bind] done" | tee -a "$LOG"
      systemctl disable tpm-clevis-bind.service >/dev/null 2>&1 || true
      EOF'
    - |
      curtin in-target --target=/target -- bash -c "cat > /etc/systemd/system/tpm-clevis-bind.service <<'EOF'
      [Unit]
      Description=One-time TPM Clevis LUKS bind (first boot fallback)
      After=multi-user.target
      ConditionPathExists=/root/tpm-clevis-bind.sh
      ConditionPathExists=!/root/clevis-bound-during-install

      [Service]
      Type=oneshot
      ExecStart=/root/tpm-clevis-bind.sh
      RemainAfterExit=no

      [Install]
      WantedBy=multi-user.target
      EOF"
    - curtin in-target --target=/target chmod 700 /root/tpm-clevis-bind.sh
    - curtin in-target --target=/target systemctl enable tpm-clevis-bind.service || true
    - curtin in-target --target=/target -- bash -c "sed -i 's/^ *#* *issue_discards *=.*/    issue_discards = 1/' /etc/lvm/lvm.conf || true"
    - curtin in-target --target=/target systemctl enable fstrim.timer || true
    - |
      curtin in-target --target=/target -- bash -c 'cp /etc/fstab /etc/fstab.orig || true; awk '\''$2=="/"{ if($4!~/noatime/){$4=$4",noatime,lazytime"} } {print}'\'' /etc/fstab > /etc/fstab.new && mv /etc/fstab.new /etc/fstab || true'
    - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"

  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

## Post-install steps:
## 1. Rotate the placeholder passphrase.
## 2. Verify unattended boot twice.
## 3. Optionally remove original passphrase slot after confirming TPM auto-unlock.
