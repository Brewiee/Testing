#cloud-config
autoinstall:
  version: 1

  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys

  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"

  network:
    version: 2
    ethernets:
      all:
        match: {name: "*"}
        dhcp4: true
        dhcp6: false
        set-name: eth0

  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu

  storage:
    config:
      - id: disk0
        type: disk
        ptable: msdos
        match:
          removable: false
        grub_device: true
      - id: boot
        type: partition
        device: disk0
        size: 1G
        flag: boot
        number: 1
        wipe: superblock
      - id: boot-format
        type: format
        fstype: ext4
        volume: boot
      - id: crypt-part
        type: partition
        device: disk0
        size: -1
        number: 2
        wipe: superblock
      - id: luks-root
        type: dm_crypt
        dm_name: luksroot
        volume: crypt-part
        key: TempInitialPass   # Temporary passphrase; replaced by keyfile
      - id: luks-root-fs
        type: format
        fstype: ext4
        volume: luks-root
        label: ROOTFS
      - id: mount-root
        type: mount
        device: luks-root-fs
        path: /
      - id: mount-boot
        type: mount
        device: boot-format
        path: /boot

  ssh:
    install-server: false
    authorized-keys: []

  packages: [curl, cryptsetup, cryptsetup-initramfs]
  snaps: []

  early-commands:
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true

  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** late start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target apt-get -y install curl gnupg software-properties-common || true
    - curtin in-target --target=/target -- bash -c 'mkdir -p /etc/apt/keyrings'
    - curtin in-target --target=/target -- bash -c 'curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/microsoft.gpg'
    - curtin in-target --target=/target -- bash -c 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" > /etc/apt/sources.list.d/microsoft.list'
    - curtin in-target --target=/target apt-get update || true
    - curtin in-target --target=/target -- bash -c 'apt-get install -y mdatp || echo mdatp install failed >> /root/autoinstall.log'
    - curtin in-target --target=/target -- bash -c 'if command -v mdatp >/dev/null 2>&1; then mdatp --register --tenant-id 9e2777ed-8237-4ab9-9278-2c144d6f6da3 || echo register failed >> /root/autoinstall.log; fi'
    - curtin in-target --target=/target apt-get -y install cryptsetup cryptsetup-initramfs || echo cryptsetup install failed >> /root/autoinstall.log
    # Create keyfile, add to LUKS, update crypttab for unattended unlock (retain original passphrase)
    - |
      curtin in-target --target=/target -- bash -c 'set -e
      LOG=/root/autoinstall.log
      echo "[keyfile] start" >>$LOG
      DEV=$(cryptsetup status luksroot 2>/dev/null | sed -n "s/^ *device: *//p" | head -1)
      if [ -z "$DEV" ]; then echo "[keyfile] no_dev" >>$LOG; exit 1; fi
      install -d -m 700 /etc/cryptsetup-keys.d
      KF=/etc/cryptsetup-keys.d/luksroot.key
      if [ ! -s "$KF" ]; then umask 077; head -c 64 /dev/urandom > "$KF"; fi
      echo TempInitialPass | cryptsetup luksAddKey "$DEV" "$KF" 2>>$LOG || echo "[keyfile] addkey_fail" >>$LOG
      UUID=$(blkid -s UUID -o value "$DEV")
      sed -i "/^luksroot /d" /etc/crypttab || true
      echo "luksroot UUID=$UUID $KF luks,discard,initramfs" >> /etc/crypttab
      chmod 600 /etc/crypttab "$KF"
      echo "[keyfile] crypttab:" >>$LOG
      grep "^luksroot " /etc/crypttab >>$LOG || echo "[keyfile] crypttab_line_missing" >>$LOG
      update-initramfs -u -k all >>$LOG 2>&1 || echo "[keyfile] update-initramfs_fail" >>$LOG
      if lsinitramfs /boot/initrd.img-* | grep -q luksroot.key; then echo "[keyfile] embedded" >>$LOG; else echo "[keyfile] not_embedded" >>$LOG; fi
      echo "[keyfile] done" >>$LOG'
    # Keeping temporary passphrase as fallback; not removed.
    - curtin in-target --target=/target -- bash -c "echo '*** late done ***' >> /root/autoinstall.log"

  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

# After install: verify unattended boot, then rotate user password & remove passwordless sudo.
