  - curtin in-target --target=/target -- apt-get update
  - curtin in-target --target=/target -- apt-get install -y curl gnupg software-properties-common
  - curtin in-target --target=/target -- bash -c 'curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/microsoft.gpg'
  - curtin in-target --target=/target -- bash -c 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" > /etc/apt/sources.list.d/microsoft.list'
  - curtin in-target --target=/target -- apt-get update
