#cloud-config
autoinstall:
  version: 1
  interactive-sections: []

  # Identity (user, host, password)
  identity:
    hostname: P250253.vito.local
    username: user
    # Use a proper SHA-512 hashed password; you can generate this using e.g. `mkpasswd -m sha-512`
    password: "$6$rounds=656000$qS8.Vr0OWFWR6nxW$mhtDmYtCGrlyDjSAgCsRsiZqTuGYUkKSkrG5uq0j.KL4oAj/qXNy.3IFbHnag641DPHuFlPw7rxs2YPiVBB1B."

  # SSH configuration
  ssh:
    install-server: false
    allow-pw: false
    # optionally you can add `authorized-keys` here if you want key-based auth

  # Locale, keyboard, time zone
  locale: "en_US.UTF-8"
  keyboard:
    layout: be
    variant: ""
  timezone: "Europe/Brussels"

  # Network: simplest is DHCP
  network:
    version: 2
    ethernets:
      eth0:
        match:
          name: "*"
        dhcp4: true
        dhcp6: false

  # Storage layout with LUKS root (TPM2 auto-unlock to be enrolled on first boot)
  storage:
    config:
      - type: disk
        id: disk0
        match:
          size: largest
        wipe: superblock-recursive
        ptable: gpt
      - type: partition
        id: efi
        device: disk0
        size: 512M
        flag: boot
      - type: format
        id: efifs
        volume: efi
        fstype: fat32
      - type: mount
        id: efimount
        device: efifs
        path: /boot/efi
      - type: partition
        id: bootpart
        device: disk0
        size: 1G
      - type: format
        id: bootfs
        fstype: ext4
        volume: bootpart
      - type: mount
        id: bootmount
        device: bootfs
        path: /boot
      - type: partition
        id: rootpart
        device: disk0
        size: -1
      - type: dm_crypt
        id: cryptroot
        volume: rootpart
        key: TempPassToRemove!
        cipher: aes-xts-plain64
      - type: format
        id: rootfs
        fstype: ext4
        volume: cryptroot
      - type: mount
        id: rootmount
        device: rootfs
        path: /

  # Updates policy
  updates: security   # options: security, all, none

  # Commands to run late in the install (in the installed target system)
  late-commands:
    - curtin in-target -- apt-get update
    - curtin in-target -- apt-get install -y cryptsetup-bin systemd
    # Install first-boot TPM enrollment script (block scalar for clean YAML)
    - |
      curtin in-target -- bash -c "cat >/usr/local/sbin/enroll-tpm-luks.sh <<'EOF'
      #!/bin/bash
      set -euo pipefail
      PASS='TempPassToRemove!'
      # Find cryptroot UUID from /etc/crypttab (expects a line with name cryptroot and UUID=...)
      UUID=$(awk '/cryptroot/ {for(i=1;i<=NF;i++) if($i ~ /UUID=/){print $i}}' /etc/crypttab | sed 's/UUID=//')
      DEV=/dev/disk/by-uuid/$UUID
      if [ -z "$UUID" ] || [ ! -b "$DEV" ]; then
        echo 'Could not determine cryptroot UUID' >&2
        exit 1
      fi
      # Enroll TPM2 token (PCRs 0+7; adjust if needed)
      echo -n "$PASS" | systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+7 --password "$DEV"
      # Remove original passphrase slot 0 (ignore failure if different slot ordering)
      echo -n "$PASS" | cryptsetup luksKillSlot "$DEV" 0 || true
      # Self-delete script
      rm -f /usr/local/sbin/enroll-tpm-luks.sh
      EOF
      curtin in-target -- chmod +x /usr/local/sbin/enroll-tpm-luks.sh
    - |
      curtin in-target -- bash -c "cat >/etc/systemd/system/tpm-enroll.service <<'EOF'
      [Unit]
      Description=Enroll TPM2 token for LUKS root (one-shot)
      After=multi-user.target
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/enroll-tpm-luks.sh
      [Install]
      WantedBy=multi-user.target
      EOF
      curtin in-target -- systemctl enable tpm-enroll.service
    - curtin in-target -- bash -c "echo 'TPM LUKS enrollment will occur on first boot.'"

  # What to do on finish
  shutdown: reboot
