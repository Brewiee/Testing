#cloud-config
# Ubuntu 24.04 Autoinstall template (Minimal Desktop + LVM + LUKS Root)                    
# Generated: 2025-08-29
# NOTE: Review every placeholder (SEARCH: CHANGE_ME) before use.
# This file is an original template inspired by public guidance; not a verbatim copy.

autoinstall:
  version: 1
  interactive-sections: []  # Explicitly declare fully non-interactive
  # source removed (desktop flavor ISO provides its own); re-add if needed with a valid id
  # ----- Locale / Keyboard ---------------------------------------------------
  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys  # Belgian Period layout

  # ----- Identity -------------------------------------------------------------
  # Password MUST be a crypt(3) hash (e.g. mkpasswd --method=SHA-512). Do NOT store clear text.
  identity:
    hostname: p250253.vito.local
    username: pcinstall
    # Password for user pcinstall (hash of provided clear text). Rotate after deployment.
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"

  # ----- Network --------------------------------------------------------------
  # Basic DHCP on all interfaces. Customize for static if needed.
  network:
    version: 2
    ethernets:
      all:
        match: {name: "*"}
        dhcp4: true
        dhcp6: false
        set-name: eth0

  # ----- Updates / Extras -----------------------------------------------------
  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu

  # ----- Storage Layout -------------------------------------------------------
  # Disk model: [ESP][BOOT][LVM PV -> VG -> LV(root)->LUKS->ext4 /]
  # First install: leave preserve off to allow creation. Reinstall: add preserve:true where needed.
  storage:
    config:
      # Physical disk (match first SSD). Adjust matcher if multiple SSDs.
      - id: disk0
        type: disk
        ptable: gpt
        grub_device: true
        name: disk0
        wipe: superblock-recursive   # Force full metadata wipe (clears prior LVM PV holding disk busy)
        # No explicit match selector: assumes exactly one internal non-USB disk present.

      # EFI System Partition (UEFI-only target) -------------------------------
      - id: esp
        type: partition
        device: disk0
        size: 1G
        flag: boot   # Use 'boot' flag for widest curtin/firmware compatibility (acts as ESP)
        number: 1
        wipe: superblock         # Comment out + add preserve:true for reinstalls
        # grub_device not required on ESP when disk already marked; avoids grub installing to partition under BIOS
      - id: esp-format
        type: format
        fstype: fat32
        volume: esp

      # /boot (unencrypted ext4) ----------------------------------------------
      - id: boot
        type: partition
        device: disk0
        size: 2G
        number: 2
      - id: boot-format
        type: format
        fstype: ext4
        volume: boot

      # LVM PV partition (use rest - will host LUKS root)
      - id: root-pv
        type: partition
        device: disk0
        size: -1
        number: 3
        wipe: superblock
      - id: vgroot
        type: lvm_volgroup
        name: vgroot
        devices: [root-pv]

      # LVM logical volume for OS root ---------------------------------------
      - id: lvroot
        type: lvm_partition
        name: lvroot
        volgroup: vgroot
        size: -1                   # Consume full VG (no separate /home dataset)
        wipe: superblock

      # LUKS on top of LV ------------------------------------------------------
      - id: luks-root
        type: dm_crypt
        dm_name: luksroot
        volume: lvroot
        key: Testing   # Initial passphrase; rotated by postinstall script

      # Format encrypted root --------------------------------------------------
      - id: luks-root-fs
        type: format
        fstype: ext4
        volume: luks-root
        label: ROOTFS

      # Mount operations (order matters) --------------------------------------
      - id: mount-root
        type: mount
        device: luks-root-fs
        path: /
      - id: mount-boot
        type: mount
        device: boot-format
        path: /boot
      - id: mount-esp
        type: mount
        device: esp-format
        path: /boot/efi

  # (No separate /home LV; resides within encrypted root filesystem.)

  # ----- Users & SSH ----------------------------------------------------------
  ssh:
    install-server: false
    authorized-keys: []            # Add keys if enabling SSH during install.

  # ----- Packages -------------------------------------------------------------
  packages:
    - curl

  snaps: []

  # ----- Early Commands (run in installer env) -------------------------------
  early-commands:
  - |
    internal=$(lsblk -ndo NAME,TYPE,RM,TRAN | awk '$2=="disk" && $3==0 && $4!~/usb/{print $1}')
    cnt=$(echo $internal | wc -w)
    if [ $cnt -ne 1 ]; then
      echo "ABORT: expected 1 internal non-usb disk, found $cnt: $internal" >&2
      exit 1
    fi
  - sed -i "s/^#*PermitRootLogin.*/PermitRootLogin no/" /etc/ssh/sshd_config || true

  # ----- Late Commands (run in target root via curtin in-target) -------------
  # Useful for: encrypting datasets later, provisioning dotfiles, hardening.
  late-commands:
  # (Polish) Early LVM activation hook to support LUKS-on-LVM layout on first boot
  - curtin in-target --target=/target -- bash -c 'mkdir -p /etc/initramfs-tools/scripts/local-top; printf "%s\n" "#!/bin/sh" "PREREQ=\"\"" "prereqs(){ echo \"$PREREQ\"; }" "case \"$1\" in" "  prereqs) prereqs; exit 0 ;;" "esac" ". /scripts/functions" "modprobe dm_mod 2>/dev/null || true" "if command -v lvm >/dev/null 2>&1; then" "  lvm pvscan --cache 2>/dev/null || true" "  lvm vgchange -ay 2>/dev/null || true" "fi" "exit 0" > /etc/initramfs-tools/scripts/local-top/10-activate-lvm; chmod 755 /etc/initramfs-tools/scripts/local-top/10-activate-lvm'
  # (Polish) Reset machine-id for image uniqueness
  - curtin in-target --target=/target -- bash -c "truncate -s0 /etc/machine-id; rm -f /var/lib/dbus/machine-id || true; ln -sf /etc/machine-id /var/lib/dbus/machine-id"
  - curtin in-target --target=/target -- bash -c "echo '*** Late commands start ***' > /root/autoinstall.log"
  - curtin in-target --target=/target apt-get update || true
  - curtin in-target --target=/target apt-get -y install curl gnupg software-properties-common || true
  - curtin in-target --target=/target -- bash -c "mkdir -p /etc/apt/keyrings"
  - curtin in-target --target=/target -- bash -c "curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/microsoft.gpg"
  - curtin in-target --target=/target -- bash -c "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main' > /etc/apt/sources.list.d/microsoft.list"
  - curtin in-target --target=/target apt-get update || true
  - curtin in-target --target=/target -- bash -c "apt-get install -y mdatp || echo mdatp install failed >> /root/autoinstall.log"
  - curtin in-target --target=/target -- bash -c "if command -v mdatp >/dev/null 2>&1; then mdatp --register --tenant-id 9e2777ed-8237-4ab9-9278-2c144d6f6da3 || echo register failed >> /root/autoinstall.log; fi"
  - curtin in-target --target=/target -- bash -c "echo '*** Late commands complete ***' >> /root/autoinstall.log"
  # --- TPM auto-enrollment (LUKS-on-LVM) ------------------------------------
  - curtin in-target --target=/target apt-get -y install cryptsetup cryptsetup-initramfs tpm2-tools || true
  - |
    cat <<'EOF' >/target/usr/local/sbin/fde-tpm-enroll.sh
    #!/bin/bash
    set -euo pipefail
    LOG=/root/autoinstall.log
    echo "[tpm] enroll_start" >> $LOG
    DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
    if [ -z "$DEV" ]; then echo "[tpm] no_crypto_device" >>$LOG; exit 0; fi
    echo "[tpm] dev=$DEV" >>$LOG
    # Enroll token (no PCRs for widest compatibility / VM environments)
    if echo -n Testing | systemd-cryptenroll --tpm2-device=auto --unlock-key-file=/dev/stdin "$DEV" >>$LOG 2>&1; then
      echo "[tpm] enroll_success" >>$LOG
    else
      echo "[tpm] enroll_failed" >>$LOG; exit 0
    fi
    if cryptsetup luksDump "$DEV" 2>/dev/null | grep -qi systemd-tpm2; then
      echo "[tpm] token_present" >>$LOG
      # Ensure crypttab includes tpm2-device=auto
      if grep -q '^luksroot' /etc/crypttab; then
        awk 'BEGIN{d=0} /^luksroot/ && !d {u=$2;k=$3;o=$4; if(k==""||k=="-"||k=="none") k="none"; if(o=="") o="luks"; if(o!~/tpm2-device=auto/) o=o",tpm2-device=auto"; print "luksroot "u" "k" "o; d=1; next} {print}' /etc/crypttab > /etc/crypttab.new && mv /etc/crypttab.new /etc/crypttab && echo "[tpm] crypttab_updated" >>$LOG || echo "[tpm] crypttab_update_failed" >>$LOG
      else
        echo "[tpm] crypttab_missing" >>$LOG
      fi
      update-initramfs -u -k all >>$LOG 2>&1 || echo "[tpm] initramfs_update_fail" >>$LOG
      echo "[tpm] enroll_done" >>$LOG
    else
      echo "[tpm] token_absent" >>$LOG
    fi
    EOF
  - chmod 700 /target/usr/local/sbin/fde-tpm-enroll.sh
  - curtin in-target --target=/target -- /usr/local/sbin/fde-tpm-enroll.sh || true
  - |
    cat <<'EOF' >/target/usr/local/sbin/fde-tpm-finalize.sh
    #!/bin/bash
    # Remove original passphrase slot (default slot 0) after confirming unattended boot works.
    set -euo pipefail
    DEV=${1:-$(blkid -t TYPE=crypto_LUKS -o device | head -1)}
    if [ -z "$DEV" ]; then echo "No LUKS device found"; exit 1; fi
    if ! cryptsetup luksDump "$DEV" | grep -qi systemd-tpm2; then echo "No TPM2 token present"; exit 2; fi
    SLOT=${WIPE_SLOT:-0}
    systemd-cryptenroll --wipe-slot=$SLOT "$DEV"
    echo "Wiped keyslot $SLOT. Reboot to verify."
    EOF
  - chmod 700 /target/usr/local/sbin/fde-tpm-finalize.sh
  - curtin in-target --target=/target -- bash -c "echo '[tpm] automation_added' >> /root/autoinstall.log"

  # ----- User Data / OEM Config ----------------------------------------------
  timezone: Europe/Brussels
  # Permit passwordless sudo for initial bootstrap (tighten post-install)
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]


# ------------------- Post-Install Recommendations -----------------------------
# 1. Change LUKS passphrase: cryptsetup luksChangeKey /dev/mapper/vgroot-lvroot
# 2. Remove passwordless sudo: rm /etc/sudoers.d/90-cloud-init-users
# 3. Run updates & verify Defender registration.
# -----------------------------------------------------------------------------
