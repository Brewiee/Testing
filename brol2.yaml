#cloud-config
autoinstall:
  version: 1

  locale: en_US.UTF-8
  keyboard:
    layout: be
    variant: nodeadkeys

  identity:
    hostname: p250253.vito.local
    username: pcinstall
    password: "$6$rounds=4096$9SgMJXq8AVq46PUs$.I/aiO8U.o9pfYOw7CrpoXCduJTWToE9usOASpK9aqUcNYMvEAQcZ1B5OamhbR2FEbQOdsrgVhnEneKwXczSp1"

  network:
    version: 2
    ethernets:
      all:
        match: {name: "*"}
        dhcp4: true
        dhcp6: false
        set-name: eth0

  updates: security
  apt:
    primary:
      - arches: [amd64]
        uri: http://archive.ubuntu.com/ubuntu

  storage:
    config:
      - id: disk0
        type: disk
        ptable: msdos
        match:
          removable: false
        grub_device: true
      - id: boot
        type: partition
        device: disk0
        size: 1G
        flag: boot
        number: 1
        wipe: superblock
      - id: boot-format
        type: format
        fstype: ext4
        volume: boot
      - id: crypt-part
        type: partition
        device: disk0
        size: -1
        number: 2
        wipe: superblock
      - id: luks-root
        type: dm_crypt
        dm_name: luksroot
        volume: crypt-part
        key: TempInitialPass   # Temporary setup passphrase; removed after TPM2 token enrollment for TPM-only unlock
      - id: luks-root-fs
        type: format
        fstype: ext4
        volume: luks-root
        label: ROOTFS
      - id: mount-root
        type: mount
        device: luks-root-fs
        path: /
      - id: mount-boot
        type: mount
        device: boot-format
        path: /boot

  ssh:
    install-server: false
    authorized-keys: []

  early-commands:
    - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config || true

  late-commands:
    - curtin in-target --target=/target -- bash -c "echo '*** late start ***' > /root/autoinstall.log"
    - curtin in-target --target=/target -- apt-get update || true
    - curtin in-target --target=/target -- apt-get -y install curl gnupg software-properties-common || true
    - curtin in-target --target=/target -- bash -c 'mkdir -p /etc/apt/keyrings'
    - curtin in-target --target=/target -- bash -c 'curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/keyrings/microsoft.gpg'
    - curtin in-target --target=/target -- bash -c 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" > /etc/apt/sources.list.d/microsoft.list'
    - curtin in-target --target=/target -- apt-get update || true
    - curtin in-target --target=/target -- bash -c 'apt-get install -y mdatp || echo mdatp install failed >> /root/autoinstall.log'
    - curtin in-target --target=/target -- bash -c 'if command -v mdatp >/dev/null 2>&1; then mdatp --register --tenant-id 9e2777ed-8237-4ab9-9278-2c144d6f6da3 || echo register failed >> /root/autoinstall.log; fi'
    - curtin in-target --target=/target -- apt-get -y install cryptsetup cryptsetup-initramfs tpm2-tools || echo cryptsetup/tpm2 install failed >> /root/autoinstall.log
    # Enroll TPM2 token (systemd-cryptenroll) and rebuild initramfs; no crypttab modification needed
    - |
      cat <<'EOF' >/target/root/tpm-enroll.sh
      #!/bin/bash
      # Relax error handling so we attempt all detection methods
      set -u
      LOG=/root/autoinstall.log
      echo "[tpm] start" >>$LOG
      # Try direct cryptsetup status (mapper name expected)
      MAPPER_NAME=luksroot
      DEV=$(cryptsetup status "$MAPPER_NAME" 2>/dev/null | sed -n 's/^ *device: *//p' | head -1)
      if [ -z "$DEV" ]; then
        # Derive from root mount
        ROOT_SRC=$(findmnt -no SOURCE / || true)
        echo "[tpm] root_source=$ROOT_SRC" >>$LOG
        if [[ "$ROOT_SRC" == /dev/mapper/* ]]; then
          DMNODE=${ROOT_SRC#/dev/}
          # Find underlying physical partition
          UNDER=/sys/class/block/${DMNODE}/slaves
          if [ -d "$UNDER" ]; then
            DEV=$(readlink -f "$UNDER"/* 2>/dev/null | head -1)
          fi
        fi
      fi
      # lsblk scan for crypto_LUKS if still empty
      if [ -z "$DEV" ]; then
        DEV=$(lsblk -pn -o NAME,FSTYPE,TYPE | awk '$2=="crypto_LUKS"{print $1;exit}')
        [ -n "$DEV" ] && echo "[tpm] lsblk_detect=$DEV" >>$LOG
      fi
      # Parse crypttab UUID if still empty
      if [ -z "$DEV" ] && grep -q '^luksroot' /etc/crypttab 2>/dev/null; then
        CT_UUID=$(awk '/^luksroot/{print $2}' /etc/crypttab | sed 's/^UUID=//')
        if [ -n "${CT_UUID}" ]; then
          DEV=$(blkid -U "${CT_UUID}" 2>/dev/null || true)
          [ -n "$DEV" ] && echo "[tpm] crypttab_uuid_detect=$DEV" >>$LOG
        fi
      fi
      if [ -z "$DEV" ]; then
        # Fallback: first crypto_LUKS device
        DEV=$(blkid -t TYPE=crypto_LUKS -o device | head -1 || true)
      fi
      if [ -z "$DEV" ]; then echo "[tpm] no_dev" >>$LOG; exit 0; fi
      echo "[tpm] dev=$DEV" >>$LOG
      # Decide PCR policy
      [ -d /sys/firmware/efi ] && PCR_OPT="--tpm2-pcrs=7" || PCR_OPT=""
      echo "[tpm] pcr_opt='${PCR_OPT}'" >>$LOG
      # Enroll token
      if echo -n TempInitialPass | systemd-cryptenroll --tpm2-device=auto $PCR_OPT --unlock-key-file=- "$DEV" >>$LOG 2>&1; then
        echo "[tpm] enroll_ok_primary" >>$LOG
      else
        echo "[tpm] enroll_fail_primary (retry no PCR)" >>$LOG
        # Retry without any PCR binding (VirtualBox / non-EFI often needs this)
        if echo -n TempInitialPass | systemd-cryptenroll --tpm2-device=auto --unlock-key-file=- "$DEV" >>$LOG 2>&1; then
          echo "[tpm] enroll_ok_fallback" >>$LOG
        else
          echo "[tpm] enroll_fail_fallback" >>$LOG
        fi
      fi
      TOKEN_FLAG=missing
      if cryptsetup luksDump "$DEV" 2>/dev/null | grep -qi 'systemd-tpm2'; then
        echo "[tpm] token_present" >>$LOG
        TOKEN_FLAG=present
      else
        echo "[tpm] token_missing" >>$LOG
      fi
      # If token present, append tpm2-device=auto to crypttab entry (if not already) so initramfs tries TPM early
      if [ "$TOKEN_FLAG" = present ]; then
        if grep -q '^luksroot' /etc/crypttab; then
          if ! grep -q 'tpm2-device=auto' /etc/crypttab; then
            sed -i "s/^luksroot[[:space:]].*/& tpm2-device=auto/" /etc/crypttab || echo "[tpm] crypttab_mod_fail" >>$LOG
            echo "[tpm] crypttab_modified" >>$LOG
          else
            echo "[tpm] crypttab_already_had_tpm2" >>$LOG
          fi
        else
          echo "[tpm] crypttab_missing_entry" >>$LOG
        fi
      fi
      # Keep passphrase slot for now (wipe after manual verification)
      update-initramfs -u -k all >>$LOG 2>&1 || echo "[tpm] update_initramfs_fail" >>$LOG
      echo "[tpm] done" >>$LOG
      EOF
      chmod 700 /target/root/tpm-enroll.sh
      chroot /target /root/tpm-enroll.sh || true
  # Passphrase retained for fallback; wipe after confirming unattended boot
    - curtin in-target --target=/target -- bash -c "echo '*** late done ***' >> /root/autoinstall.log"

  timezone: Europe/Brussels
  user-data:
    disable_root: true
    package_update: false
    package_upgrade: false
    runcmd:
      - [ sh, -c, "echo '%sudo ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-cloud-init-users" ]

# After install: verify unattended boot, then rotate user password & remove passwordless sudo.
